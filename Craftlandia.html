<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#141E33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Craftlandia">
<title>Craftlandia — Aprende construyendo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   CRAFTLANDIA · Sistema visual v2
   Cada superficie del juego es un volumen, no un rectángulo. Los bloques se
   dibujan con tres caras reales (arriba, frente, costado) y una sola fuente
   de luz arriba-izquierda, constante en toda la interfaz.
   ========================================================================== */
:root{
  --cielo-alto:#101B33;
  --cielo-medio:#27406B;
  --cielo-bajo:#5B7BA8;
  --horizonte:#C08A6E;

  --pasto:#5BA83C;
  --tierra:#8B5A2B;
  --piedra:#79839A;
  --oro:#F0B02E;
  --diamante:#3FCFCB;
  --rubi:#D14B3C;
  --amatista:#8B6BD9;

  --tinta:#0D1424;
  --hueso:#FBF7EC;
  --niebla:rgba(251,247,236,.62);

  --luz:rgba(255,255,255,.30);
  --media:rgba(0,0,0,.14);
  --oscura:rgba(0,0,0,.34);

  --iso-x:-26deg;
  --iso-y:-38deg;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:'Fredoka',Verdana,'Trebuchet MS',sans-serif;
  font-weight:500;
  background:var(--cielo-alto);
  color:var(--hueso);
  display:flex;align-items:center;justify-content:center;
  user-select:none;
  -webkit-font-smoothing:antialiased;
}

/* ============================ MUNDO DE FONDO ============================ */
#mundo{position:fixed;inset:0;z-index:0;overflow:hidden;}

#atmosfera{
  position:absolute;inset:0;
  background:linear-gradient(180deg,
    var(--cielo-alto) 0%, #1B2B4C 26%, var(--cielo-medio) 52%,
    #47638F 70%, var(--cielo-bajo) 84%, var(--horizonte) 100%);
}
#estrellas{position:absolute;inset:0 0 42% 0;}
#estrellas i{
  position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;
  animation:titila 4s ease-in-out infinite;
}
@keyframes titila{0%,100%{opacity:.15}50%{opacity:.9}}

#astro{
  position:absolute;top:9%;right:13%;width:74px;height:74px;
  background:radial-gradient(circle at 36% 34%,#FFF6D8,#FFD98A 52%,#F0B02E 74%,transparent 76%);
  filter:drop-shadow(0 0 34px rgba(240,176,46,.5));
  animation:respira 7s ease-in-out infinite;
}
@keyframes respira{0%,100%{transform:scale(1);opacity:.92}50%{transform:scale(1.05);opacity:1}}

.capa-cerro{position:absolute;left:0;bottom:0;width:200%;height:100%;}
.capa-cerro svg{position:absolute;bottom:0;left:0;width:50%;height:100%;}
.capa-cerro svg+svg{left:50%;}
#cerros1{animation:deriva 190s linear infinite;opacity:.34;}
#cerros2{animation:deriva 120s linear infinite;opacity:.55;}
#cerros3{animation:deriva 74s linear infinite;opacity:.9;}
@keyframes deriva{from{transform:translateX(0)}to{transform:translateX(-50%)}}

#nubes{position:absolute;inset:0 0 40% 0;}
.nube{position:absolute;display:flex;filter:drop-shadow(0 6px 0 rgba(0,0,0,.10));}
.nube b{display:block;background:rgba(255,255,255,.82);}

#terreno{
  position:absolute;left:0;right:0;bottom:0;height:110px;
  background:
    linear-gradient(180deg,
      #74C24C 0 9px, var(--pasto) 9px 26px,
      #A6703A 26px 44px, var(--tierra) 44px 74px,
      #6D7488 74px 100%);
  box-shadow:0 -3px 0 rgba(255,255,255,.16), inset 0 -40px 60px rgba(0,0,0,.30);
}
#terreno::before{
  content:"";position:absolute;inset:0;
  background-image:
    linear-gradient(90deg,rgba(0,0,0,.13) 2px,transparent 2px),
    linear-gradient(180deg,rgba(0,0,0,.10) 2px,transparent 2px);
  background-size:34px 26px;
}
#pastos{position:absolute;left:0;right:0;bottom:98px;height:14px;}
#pastos i{position:absolute;bottom:0;width:4px;background:#7FD154;transform-origin:bottom;
  animation:ondea 3.4s ease-in-out infinite;}
@keyframes ondea{0%,100%{transform:skewX(0deg)}50%{transform:skewX(-11deg)}}

#motas{position:absolute;inset:0;}
#motas i{position:absolute;width:3px;height:3px;background:rgba(255,236,180,.85);
  border-radius:50%;animation:flota linear infinite;}
@keyframes flota{
  0%{transform:translate(0,0);opacity:0}
  12%{opacity:.85}
  88%{opacity:.6}
  100%{transform:translate(34px,-130px);opacity:0}
}
#vineta{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 42%,transparent 42%,rgba(6,10,20,.55) 100%);}

/* ============================ BLOQUE ISOMÉTRICO ============================ */
.iso{
  position:relative;transform-style:preserve-3d;
  transform:rotateX(var(--iso-x)) rotateY(var(--iso-y));
  width:var(--s);height:var(--s);flex-shrink:0;
}
.iso u{position:absolute;inset:0;display:block;}
.iso .cf{transform:translateZ(calc(var(--s)/2));}
.iso .cl{transform:rotateY(90deg) translateZ(calc(var(--s)/2));filter:brightness(.66);}
.iso .ct{transform:rotateX(90deg) translateZ(calc(var(--s)/2));filter:brightness(1.28);}
.iso u::after{
  content:"";position:absolute;inset:0;
  background-image:
    radial-gradient(circle at 22% 26%,rgba(0,0,0,.16) 14%,transparent 15%),
    radial-gradient(circle at 72% 62%,rgba(0,0,0,.13) 12%,transparent 13%),
    radial-gradient(circle at 46% 82%,rgba(255,255,255,.14) 11%,transparent 12%);
  background-size:50% 50%;
}

/* ============================ SUPERFICIE / BOTONES ============================ */
#app{
  position:relative;z-index:3;width:100%;max-width:900px;height:100%;
  padding:calc(16px + env(safe-area-inset-top)) 16px calc(10px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;
  overflow-y:auto;overflow-x:hidden;scrollbar-width:none;
}
#app::-webkit-scrollbar{display:none;}

.losa{
  position:relative;border:0;border-radius:5px;
  background:var(--piedra);color:var(--hueso);
  font-family:inherit;font-weight:600;
  box-shadow:
    inset 0 5px 0 var(--luz),
    inset 0 -6px 0 var(--oscura),
    inset 6px 0 0 rgba(255,255,255,.09),
    inset -6px 0 0 var(--media),
    0 7px 0 rgba(8,12,22,.42),
    0 12px 22px rgba(0,0,0,.30);
  transition:transform .12s cubic-bezier(.34,1.56,.64,1), box-shadow .12s, filter .16s;
  cursor:pointer;overflow:hidden;
}
.losa::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:
    radial-gradient(circle at 16% 22%,rgba(0,0,0,.09) 10%,transparent 11%),
    radial-gradient(circle at 78% 68%,rgba(0,0,0,.07) 9%,transparent 10%);
  background-size:44px 44px;opacity:.8;
}
.losa::after{
  content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.30),transparent);
  transform:skewX(-18deg);opacity:0;pointer-events:none;
}
.losa:hover:not(:disabled){transform:translateY(-3px);filter:brightness(1.06);}
.losa:hover:not(:disabled)::after{animation:destello .7s ease-out;}
@keyframes destello{0%{left:-70%;opacity:.9}100%{left:120%;opacity:0}}
.losa:active:not(:disabled){
  transform:translateY(6px);
  box-shadow:inset 0 5px 0 var(--luz),inset 0 -3px 0 var(--oscura),0 1px 0 rgba(8,12,22,.42);
}
.losa:focus-visible{outline:4px solid #FFD066;outline-offset:4px;}
.losa:disabled{cursor:not-allowed;}

.t-pasto{background:var(--pasto);}
.t-oro{background:var(--oro);color:#3A2803;}
.t-diamante{background:var(--diamante);color:#06322F;}
.t-rubi{background:var(--rubi);}
.t-amatista{background:var(--amatista);}
.t-cielo{background:#3B6FD4;}
.t-piedra{background:var(--piedra);}
.t-tierra{background:var(--tierra);}
.t-off{background:#3E465C;color:#8892A8;box-shadow:inset 0 4px 0 rgba(255,255,255,.07),inset 0 -5px 0 rgba(0,0,0,.3),0 5px 0 rgba(8,12,22,.35);}
.t-off:hover{transform:none;filter:none;}

/* ============================ ENCABEZADO ============================ */
.barra{display:flex;align-items:center;gap:11px;margin-bottom:16px;flex-shrink:0;}
.icono-btn{padding:12px 15px;font-size:17px;line-height:1;}
.rotulo{flex:1;min-width:0;}
.rotulo b{display:block;font-size:20px;font-weight:600;letter-spacing:.2px;
  text-shadow:0 3px 0 rgba(6,10,20,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rotulo span{display:block;font-size:12px;font-weight:400;color:var(--niebla);margin-top:2px;}

.medidor{
  display:flex;align-items:center;gap:9px;padding:9px 13px;border-radius:5px;
  background:rgba(8,13,26,.62);font-size:14px;font-weight:600;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.10),inset 0 -3px 0 rgba(0,0,0,.35);
  backdrop-filter:blur(3px);
}
.medidor .sep{opacity:.3;}

/* ============================ PANTALLAS ============================ */
.pantalla{display:flex;flex-direction:column;flex:1;min-height:0;}
.entra{animation:entraArriba .42s cubic-bezier(.22,1,.3,1) backwards;}
@keyframes entraArriba{from{opacity:0;transform:translateY(22px) scale(.985)}to{opacity:1;transform:none}}
.sale{animation:saleAbajo .2s ease-in forwards;}
@keyframes saleAbajo{to{opacity:0;transform:translateY(-14px) scale(.99)}}

/* ============================ PORTADA ============================ */
.marca{text-align:center;margin:14px 0 26px;}
.marca h1{
  font-size:clamp(38px,10vw,68px);font-weight:700;letter-spacing:2px;line-height:.95;
  color:#8FE05F;
  text-shadow:0 3px 0 #4E9633,0 6px 0 #356824,0 11px 0 rgba(6,10,20,.5),0 18px 30px rgba(0,0,0,.5);
  animation:brinca 4.5s ease-in-out infinite;
}
@keyframes brinca{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.marca p{margin-top:14px;font-size:13px;font-weight:400;color:var(--niebla);letter-spacing:.6px;}

.jugadores{display:grid;grid-template-columns:1fr 1fr;gap:15px;}
.ficha{
  padding:22px 12px 18px;display:flex;flex-direction:column;align-items:center;gap:11px;
  font-size:21px;font-weight:600;
}
.ficha .plataforma{
  display:flex;justify-content:center;align-items:flex-end;
  height:132px;margin-bottom:-6px;position:relative;
}
.ficha .sombra{
  position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
  width:56px;height:12px;border-radius:50%;background:rgba(0,0,0,.34);filter:blur(3px);
  animation:sombraLate 2.8s ease-in-out infinite;
}
@keyframes sombraLate{0%,100%{width:56px;opacity:.34}50%{width:46px;opacity:.24}}
.ficha .edad{font-size:12px;font-weight:400;opacity:.9;}
.ficha .sello{
  font-size:11px;font-weight:500;padding:6px 11px;border-radius:4px;
  background:rgba(0,0,0,.26);box-shadow:inset 0 2px 0 rgba(0,0,0,.2);
}

/* Personaje pixelado */
.avatar{display:grid;image-rendering:pixelated;filter:drop-shadow(0 5px 0 rgba(0,0,0,.22));}
.avatar i{display:block;}
.anim-idle{animation:idle 2.8s ease-in-out infinite;}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.avatar i.ojo{animation:parpadeo 5.2s infinite;}
@keyframes parpadeo{0%,95.5%,100%{opacity:1}96%,98%{opacity:0}}

/* ============================ MAPA DE BIOMAS ============================ */
.biomas{display:flex;flex-direction:column;gap:12px;}
.bioma{display:flex;align-items:center;gap:15px;padding:16px 17px;text-align:left;}
.bioma .emblema{
  width:56px;height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:29px;border-radius:5px;background:rgba(0,0,0,.24);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.12),inset 0 -3px 0 rgba(0,0,0,.28);
}
.bioma .cuerpo{flex:1;min-width:0;}
.bioma .cuerpo b{display:block;font-size:17px;font-weight:600;}
.bioma .cuerpo em{display:block;font-style:normal;font-size:12px;font-weight:400;opacity:.88;margin-top:3px;}
.riel{height:13px;border-radius:3px;background:rgba(0,0,0,.42);margin-top:9px;overflow:hidden;
  box-shadow:inset 0 3px 0 rgba(0,0,0,.35);}
.riel i{display:block;height:100%;border-radius:3px;
  background:linear-gradient(180deg,#FFD066 0 4px,var(--oro) 4px 100%);
  transition:width .8s cubic-bezier(.22,1,.3,1);}

/* ============================ CAMINO DE NIVELES ============================ */
.camino{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:13px;padding-bottom:8px;}
.nodo{padding:15px 8px 13px;display:flex;flex-direction:column;align-items:center;gap:9px;
  font-size:12px;font-weight:500;line-height:1.35;text-align:center;}
.nodo .cima{height:46px;display:flex;align-items:center;justify-content:center;}
.nodo .cifra{
  width:44px;height:44px;border-radius:5px;font-size:21px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.26);box-shadow:inset 0 3px 0 rgba(255,255,255,.14),inset 0 -3px 0 rgba(0,0,0,.3);
}
.astros{display:flex;gap:3px;height:17px;}
.astros svg{width:15px;height:15px;}
.astros .lleno{fill:#FFD066;filter:drop-shadow(0 1px 0 #A9750E);}
.astros .vacio{fill:rgba(0,0,0,.32);}

/* ============================ JUEGO ============================ */
.escena{flex:1;display:flex;flex-direction:column;gap:15px;justify-content:center;min-height:0;}
.tablilla{
  padding:20px 18px;text-align:center;border-radius:6px;
  background:linear-gradient(180deg,rgba(10,16,30,.72),rgba(10,16,30,.55));
  box-shadow:inset 0 3px 0 rgba(255,255,255,.11),inset 0 -4px 0 rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.32);
  backdrop-filter:blur(4px);
}
.tablilla .enunciado{font-size:clamp(19px,4.8vw,27px);font-weight:600;line-height:1.35;
  text-shadow:0 2px 0 rgba(0,0,0,.4);}
.montaje{display:flex;flex-wrap:wrap;gap:13px;justify-content:center;align-items:center;margin-top:18px;}
.montaje .iso{animation:surge .42s cubic-bezier(.3,1.6,.5,1) backwards;}
@keyframes surge{from{transform:rotateX(var(--iso-x)) rotateY(var(--iso-y)) scale(0) translateY(-40px);opacity:0}
                 to{transform:rotateX(var(--iso-x)) rotateY(var(--iso-y)) scale(1);opacity:1}}
.conjunto{display:flex;gap:20px;align-items:center;justify-content:center;flex-wrap:wrap;}
.operador{font-size:30px;font-weight:700;opacity:.85;text-shadow:0 3px 0 rgba(0,0,0,.4);}
.fantasma{opacity:.24;filter:grayscale(1);}

.opciones{display:grid;grid-template-columns:repeat(2,1fr);gap:13px;}
.opciones.de3{grid-template-columns:repeat(3,1fr);}
.opcion{
  min-height:96px;padding:14px 8px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:7px;
  font-size:clamp(26px,7.5vw,40px);font-weight:700;
  text-shadow:0 3px 0 rgba(0,0,0,.24);
  animation:entraOpcion .34s cubic-bezier(.22,1,.3,1) backwards;
}
@keyframes entraOpcion{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}
.opcion .conteo{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:160px;}
.opcion .conteo i{width:12px;height:12px;border-radius:2px;background:rgba(0,0,0,.36);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.18);}
.opcion .muestra{width:52px;height:52px;}

/* --- Fichas de madera para letras y sílabas --- */
.ficha-letra{
  min-width:46px;height:58px;padding:0 11px;border-radius:5px;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(22px,5.6vw,30px);font-weight:700;color:#4A3208;
  background:linear-gradient(180deg,#F0D8A4 0 6px,#DDBE7E 6px 100%);
  box-shadow:inset 0 5px 0 rgba(255,255,255,.5),inset 0 -6px 0 rgba(0,0,0,.2),
             inset 5px 0 0 rgba(255,255,255,.16),inset -5px 0 0 rgba(0,0,0,.12),
             0 6px 0 rgba(8,12,22,.42);
  animation:surgeFicha .38s cubic-bezier(.3,1.6,.5,1) backwards;
}
@keyframes surgeFicha{from{transform:translateY(-22px) scale(.7);opacity:0}to{transform:none;opacity:1}}
.ficha-letra.hueco{
  background:rgba(8,13,26,.55);color:#FFD066;
  box-shadow:inset 0 4px 0 rgba(0,0,0,.45),inset 0 -3px 0 rgba(255,255,255,.09),0 5px 0 rgba(8,12,22,.4);
  animation:surgeFicha .38s cubic-bezier(.3,1.6,.5,1) backwards, palpita 1.5s ease-in-out infinite .4s;
}
@keyframes palpita{0%,100%{filter:brightness(1)}50%{filter:brightness(1.5)}}
.ficha-letra.silaba{font-size:clamp(18px,4.6vw,25px);letter-spacing:.5px;}
.tira{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;}

.emojo{font-size:clamp(54px,15vw,78px);line-height:1;filter:drop-shadow(0 7px 0 rgba(0,0,0,.28));
  animation:idle 3.2s ease-in-out infinite;}
.opcion .emojo{font-size:clamp(38px,10vw,50px);animation:none;}
.opcion.texto-chico{font-size:clamp(17px,4.6vw,25px);letter-spacing:.5px;}
.pedestal{display:flex;flex-direction:column;align-items:center;gap:12px;}

/* --- Banderas dibujadas con CSS (los emojis de bandera no existen en Windows) --- */
.bandera{
  position:relative;aspect-ratio:3/2;border-radius:4px;overflow:hidden;flex-shrink:0;
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.22), 0 6px 0 rgba(8,12,22,.42), 0 10px 18px rgba(0,0,0,.3);
  animation:surgeFicha .4s cubic-bezier(.3,1.6,.5,1) backwards;
}
.bandera .disco{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  border-radius:50%;aspect-ratio:1;}
.bandera .rombo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:76%;height:70%;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);}
.bandera .canton{position:absolute;left:0;top:0;width:40%;height:53.8%;}
.bandera .hoja{position:absolute;inset:0;display:grid;place-items:center;
  font-size:calc(var(--fw) * .40);line-height:1;}
.opcion div{text-align:center;line-height:1.22;}

/* --- Laboratorio: lienzo de simulación y palanca --- */
.lienzo{
  position:relative;width:100%;border-radius:6px;overflow:hidden;
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.3), 0 8px 0 rgba(8,12,22,.42), 0 14px 26px rgba(0,0,0,.35);
  background:#0E1626;
}
.lienzo canvas{display:block;width:100%;height:auto;}
.medida{
  position:absolute;top:9px;left:9px;padding:6px 11px;border-radius:4px;
  background:rgba(8,13,26,.72);font-size:13px;font-weight:600;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.1);
}
.estado{
  position:absolute;bottom:9px;left:9px;right:9px;padding:8px 11px;border-radius:4px;
  background:rgba(8,13,26,.78);font-size:13px;font-weight:500;text-align:center;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.1);
}
.estado.alerta{background:rgba(150,30,20,.85);}

.control{
  padding:14px 16px 10px;border-radius:6px;
  background:rgba(10,16,30,.6);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.09),inset 0 -4px 0 rgba(0,0,0,.35);
}
.control label{display:block;font-size:13px;font-weight:600;margin-bottom:10px;}
.palanca{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;cursor:pointer;}
.palanca::-webkit-slider-runnable-track{height:20px;border-radius:4px;
  background:linear-gradient(90deg,#3B6FD4,#F0B02E,#D14B3C);
  box-shadow:inset 0 3px 0 rgba(0,0,0,.4),inset 0 -3px 0 rgba(255,255,255,.12);}
.palanca::-webkit-slider-thumb{-webkit-appearance:none;width:36px;height:36px;margin-top:-8px;
  border-radius:5px;background:var(--hueso);
  box-shadow:inset 0 5px 0 rgba(255,255,255,.7),inset 0 -5px 0 rgba(0,0,0,.22),0 5px 0 rgba(8,12,22,.5);}
.palanca::-moz-range-track{height:20px;border-radius:4px;
  background:linear-gradient(90deg,#3B6FD4,#F0B02E,#D14B3C);}
.palanca::-moz-range-thumb{width:34px;height:34px;border:0;border-radius:5px;background:var(--hueso);
  box-shadow:0 5px 0 rgba(8,12,22,.5);}

<script>
/* ==========================================================================
   CRAFTLANDIA v2.0
   core/     Almacen · Perfiles · Sesion · Dificultad · Router
   shared/   Audio · Voz · Iso · PixelArt · Efectos · Escenografia
   biomes/   matematicas (bancos de niveles + generadores)
   world/    mapa de biomas · camino de niveles · cofre
   ========================================================================== */

const REDUCIR = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ============================ shared/Color ============================ */
function tintar(hex, factor){
  const n = parseInt(hex.slice(1),16);
  const ajusta = v => Math.max(0, Math.min(255, Math.round(v*factor)));
  const r = ajusta((n>>16)&255), g = ajusta((n>>8)&255), b = ajusta(n&255);
  return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);
}

/* ============================ shared/Iso ============================ */
/* Un bloque con tres caras reales. Misma luz en todo el juego. */
function bloqueIso(tam, color, retraso){
  const d = document.createElement('div');
  d.className = 'iso';
  d.style.setProperty('--s', tam+'px');
  if (retraso != null) d.style.animationDelay = retraso+'ms';
  ['cf','cl','ct'].forEach(c=>{
    const u = document.createElement('u');
    u.className = c;
    u.style.background = color;
    d.appendChild(u);
  });
  return d;
}

/* ============================ shared/Escenografia ============================ */
const Escenografia = (() => {
  const rnd = (a,b) => a + Math.random()*(b-a);

  function estrellas(){
    const c = document.getElementById('estrellas');
    let h = '';
    for (let i=0;i<70;i++){
      h += `<i style="left:${rnd(0,100).toFixed(2)}%;top:${rnd(0,88).toFixed(2)}%;
             animation-delay:${rnd(0,4).toFixed(2)}s;opacity:${rnd(.2,.9).toFixed(2)}"></i>`;
    }
    c.innerHTML = h;
  }

  /* Silueta de cerros hecha con bloques: caminata aleatoria, no una curva suave */
  function siluetaSVG(pasos, alturaBase, variacion, color, semilla){
    const W = 1200, H = 400, paso = W/pasos;
    let y = alturaBase, d = `M0,${H} L0,${H-y}`;
    let s = semilla;
    const azar = () => { s = (s*9301 + 49297) % 233280; return s/233280; };
    for (let i=0;i<pasos;i++){
      const salto = Math.round((azar()-0.5)*variacion/16)*16;
      y = Math.max(28, Math.min(H-40, y + salto));
      d += ` L${(i*paso).toFixed(1)},${H-y} L${((i+1)*paso).toFixed(1)},${H-y}`;
    }
    d += ` L${W},${H} Z`;
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <path d="${d}" fill="${color}"/></svg>`;
  }

  function cerros(){
    const capas = [
      {id:'cerros1', pasos:26, base:200, vari:150, color:'#2E4468', semilla:7},
      {id:'cerros2', pasos:34, base:150, vari:120, color:'#24354F', semilla:41},
      {id:'cerros3', pasos:42, base:104, vari:96,  color:'#182538', semilla:93}
    ];
    capas.forEach(c=>{
      const svg = siluetaSVG(c.pasos, c.base, c.vari, c.color, c.semilla);
      document.getElementById(c.id).innerHTML = svg + svg;
    });
  }

  /* Nubes de bloques, no de círculos */
  function nubes(){
    const cont = document.getElementById('nubes');
    const formas = [
      [[1,0],[2,0],[3,0],[0,1],[1,1],[2,1],[3,1],[4,1]],
      [[1,0],[2,0],[0,1],[1,1],[2,1],[3,1],[2,2],[3,2]],
      [[0,0],[1,0],[2,0],[3,0],[4,0],[1,1],[2,1],[3,1]]
    ];
    let h = '';
    for (let i=0;i<5;i++){
      const f = formas[i % formas.length];
      const u = Math.round(rnd(9,17));
      const top = rnd(6,40).toFixed(1);
      const dur = rnd(120,240).toFixed(0);
      const op = rnd(.30,.62).toFixed(2);
      let piezas = '';
      f.forEach(([x,y])=>{
        piezas += `<b style="position:absolute;left:${x*u}px;top:${y*u}px;width:${u}px;height:${u}px"></b>`;
      });
      h += `<div class="nube" style="top:${top}%;left:${rnd(-10,100).toFixed(1)}%;
              width:${u*6}px;height:${u*3}px;opacity:${op};position:absolute;
              animation:deriva ${dur}s linear infinite">${piezas}</div>`;
    }
    cont.innerHTML = h;
  }

  function pastos(){
    const c = document.getElementById('pastos');
    let h = '';
    for (let i=0;i<52;i++){
      h += `<i style="left:${rnd(0,100).toFixed(2)}%;height:${rnd(6,14).toFixed(0)}px;
             animation-delay:${rnd(0,3.4).toFixed(2)}s"></i>`;
    }
    c.innerHTML = h;
  }

  function motas(){
    if (REDUCIR) return;
    const c = document.getElementById('motas');
    let h = '';
    for (let i=0;i<22;i++){
      h += `<i style="left:${rnd(0,100).toFixed(2)}%;top:${rnd(40,96).toFixed(2)}%;
             animation-duration:${rnd(9,20).toFixed(1)}s;animation-delay:${rnd(0,14).toFixed(1)}s"></i>`;
    }
    c.innerHTML = h;
  }

  return { montar(){ estrellas(); cerros(); nubes(); pastos(); motas(); } };
})();

/* ============================ core/Almacen ============================ */
const Almacen = (() => {
  const CLAVE = 'craftlandia_v2';
  let cache = null;
  async function leer(){
    if (cache) return cache;
    try{
      if (window.storage){
        const r = await window.storage.get(CLAVE);
        if (r && r.value){ cache = JSON.parse(r.value); return cache; }
      }
    }catch(e){}
    try{
      const r = localStorage.getItem(CLAVE);
      if (r){ cache = JSON.parse(r); return cache; }
    }catch(e){}
    cache = { perfiles:{} };
    return cache;
  }
  async function guardar(datos){
    cache = datos;
    const txt = JSON.stringify(datos);
    try{ if (window.storage){ await window.storage.set(CLAVE, txt); return true; } }catch(e){}
    try{ localStorage.setItem(CLAVE, txt); return true; }catch(e){}
    return false;
  }
  return { leer, guardar };
})();

/* ============================ core/Perfiles ============================ */
const NINOS = {
  /* `voz` es cómo se ESCRIBE para que el sintetizador lo pronuncie bien.
     En pantalla siempre se ve `nombre`. Se puede corregir en ajustes. */
  elijah:{ nombre:'Elijah', voz:'Elaya', edad:6, perfilEdad:'grande',
    pelo:'#4A2E15', ropa:'#3F8F4F', pantalon:'#2E4C86', piel:'#E8B98C', acento:'t-pasto' },
  edain:{  nombre:'Edain',  voz:'Edáin', edad:4, perfilEdad:'chico',
    pelo:'#7B4A1E', ropa:'#E07A2C', pantalon:'#5B4A8A', piel:'#F0C79C', acento:'t-oro' }
};

/* Cómo se lee el nombre en voz alta (no cómo se escribe en pantalla). */
function nombreHablado(id){
  const a = Perfiles.ajustes();
  return (a.pron && a.pron[id]) || NINOS[id].voz || NINOS[id].nombre;
}

const Perfiles = (() => {
  let datos = { perfiles:{} }, activo = null;
  const nuevo = id => ({
    id, xp:0, estrellasTotales:0, racha:0, ultimoDia:null, biomas:{}, premios:[],
    equipado:{ cabeza:null, mano:null, espalda:null, companero:null }
  });
  /* Cada bioma que se agregue al juego aparece en los perfiles existentes
     sin borrar lo que ya tenían guardado. */
  function alinear(p){
    if (!p.biomas) p.biomas = {};
    BIOMAS.forEach(b=>{
      if (!p.biomas[b.id]) p.biomas[b.id] = { nivelMax:1, estrellas:{}, stats:{} };
      if (!p.biomas[b.id].estrellas) p.biomas[b.id].estrellas = {};
      if (!p.biomas[b.id].nivelMax) p.biomas[b.id].nivelMax = 1;
      /* stats: cómo le ha ido, no solo su mejor resultado */
      if (!p.biomas[b.id].stats) p.biomas[b.id].stats = {};
    });
    /* El reto del día tiene su propio registro, aparte de los biomas. */
    if (!p.biomas.repaso) p.biomas.repaso = { nivelMax:1, estrellas:{}, stats:{} };
    if (!p.equipado) p.equipado = { cabeza:null, mano:null, espalda:null, companero:null };
    /* Si un premio deja de estar desbloqueado, se quita solo. */
    Object.keys(p.equipado).forEach(r=>{
      const pr = PREMIOS.find(x => x.id === p.equipado[r]);
      if (pr && p.estrellasTotales < pr.costo) p.equipado[r] = null;
    });
    [].forEach(()=>{
    });
    return p;
  }
  async function iniciar(){
    datos = await Almacen.leer();
    if (!datos.perfiles) datos.perfiles = {};
    for (const id in NINOS){
      if (!datos.perfiles[id]) datos.perfiles[id] = nuevo(id);
      alinear(datos.perfiles[id]);
    }
  }
  function entrar(id){
    activo = datos.perfiles[id];
    const hoy = new Date().toISOString().slice(0,10);
    if (activo.ultimoDia !== hoy){
      const ayer = new Date(Date.now()-864e5).toISOString().slice(0,10);
      activo.racha = (activo.ultimoDia === ayer) ? activo.racha+1 : 1;
      activo.ultimoDia = hoy;
      persistir();
    }
    return activo;
  }
  const actual = () => activo;
  const todos  = () => datos.perfiles;
  const persistir = () => Almacen.guardar(datos);
  function ajustes(){ if (!datos.ajustes) datos.ajustes = {}; return datos.ajustes; }
  return { iniciar, entrar, actual, todos, persistir, ajustes };
})();

/* ============================ shared/Audio ============================ */
const Audio_ = (() => {
  let ctx = null;
  function ac(){
    if (!ctx){ try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tono(freq, inicio, dur, tipo='square', vol=.12, barrido){
    const c = ac(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = tipo; o.frequency.setValueAtTime(freq, c.currentTime+inicio);
    if (barrido) o.frequency.exponentialRampToValueAtTime(barrido, c.currentTime+inicio+dur);
    g.gain.setValueAtTime(0, c.currentTime+inicio);
    g.gain.linearRampToValueAtTime(vol, c.currentTime+inicio+.012);
    g.gain.exponentialRampToValueAtTime(.0001, c.currentTime+inicio+dur);
    o.connect(g); g.connect(c.destination);
    o.start(c.currentTime+inicio); o.stop(c.currentTime+inicio+dur+.03);
  }
  function ruido(inicio, dur, vol=.09){
    const c = ac(); if (!c) return;
    const n = Math.floor(c.sampleRate*dur);
    const buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    const s = c.createBufferSource(); s.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1100;
    const g = c.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(c.destination);
    s.start(c.currentTime+inicio);
  }
  return {
    romper(){ ruido(0,.16,.11); tono(150,0,.10,'square',.09,90); },
    acierto(){ [523,659,784,1046,1318].forEach((f,i)=>tono(f,i*.062,.19,'square',.10)); tono(1568,.31,.3,'triangle',.06); },
    fallo(){ tono(210,0,.14,'sawtooth',.06,150); tono(140,.09,.24,'square',.05); ruido(0,.1,.05); },
    nivel(){ [392,523,659,784,1046,1318,1568].forEach((f,i)=>tono(f,i*.085,.3,'square',.10));
             [196,262,330].forEach((f,i)=>tono(f,i*.085,.5,'triangle',.06)); },
    estrella(i){ tono(784+i*196, 0, .3,'triangle',.10); },
    toque(){ tono(720,0,.05,'square',.05); },
    despertar(){ ac(); }
  };
})();

/* ============================ shared/Voz ============================ */
const IDIOMAS = {
  es:{ etiqueta:'Español', respaldo:'es-MX', prueba:'Hola, vamos a jugar.' },
  en:{ etiqueta:'Inglés',  respaldo:'en-US', prueba:'dog, apple, blue, thank you' },
  fr:{ etiqueta:'Francés', respaldo:'fr-FR', prueba:'chien, pomme, bleu, merci' }
};
const CLAVES_IDIOMA = ['es','en','fr'];

/* El navegador suele traer varias voces por idioma y por defecto toma la
   primera de la lista, que casi siempre es la sintética vieja. Aquí se
   puntúan y se elige la mejor, y el papá puede cambiarlas a mano. */
const Voz = (() => {
  const listas   = {es:[], en:[], fr:[]};
  const elegidas = {es:null, en:null, fr:null};
  let activa = true, velocidad = 0.95;
  let ajustes = null, persistir = null, ultima = null;

  function puntuar(v, idioma){
    const n = (v.name || '').toLowerCase();
    const l = (v.lang || '').toLowerCase();
    let s = 0;
    /* Las "natural/neural" son las voces modernas: suenan como persona. */
    if (/natural|neural|premium|enhanced|siri/.test(n)) s += 100;
    if (/google/.test(n)) s += 55;
    /* Las viejas de sistema son las que suenan a robot. */
    if (/eloquence|compact|espeak|pico|festival/.test(n)) s -= 70;
    if (idioma === 'en'){
      if (/samantha|ava|allison|zira|aria|jenny|karen|moira/.test(n)) s += 45;
      if (l.includes('us')) s += 35;
      else if (l.includes('gb') || l.includes('uk')) s += 20;
      else s += 6;
    } else if (idioma === 'fr'){
      if (/am[eé]lie|audrey|denise|thomas|chantal|julie|marie|c[eé]line/.test(n)) s += 45;
      if (l.includes('fr-fr') || l.includes('fr_fr')) s += 35;
      else if (l.includes('ca')) s += 18;
      else s += 6;
    } else {
      if (/paulina|m[oó]nica|sabina|dalia|helena|laura|lupe|ang[eé]lica|marisol|ximena|isabela|elvira/.test(n)) s += 45;
      if (l.includes('mx')) s += 35;
      else if (l.includes('us')) s += 22;
      else if (l.includes('es-es') || l.includes('es_es')) s += 14;
      else s += 6;
    }
    return s;
  }

  /* Compatibilidad con partidas guardadas antes de los tres idiomas. */
  function guardadaDe(k){
    if (!ajustes) return null;
    return ajustes['voz_'+k] ||
           (k === 'es' ? ajustes.vozURI : k === 'en' ? ajustes.vozEnURI : null);
  }

  function cargar(){
    if (!('speechSynthesis' in window)) return;
    let vs = [];
    try{ vs = speechSynthesis.getVoices() || []; }catch(e){ return; }
    CLAVES_IDIOMA.forEach(k=>{
      const rx = new RegExp('^'+k, 'i');
      listas[k] = vs.filter(v => rx.test(v.lang || '')).sort((a,b)=>puntuar(b,k)-puntuar(a,k));
      const g = guardadaDe(k);
      elegidas[k] = listas[k].find(v => v.voiceURI === g) || listas[k][0] || null;
    });
  }

  let desbloqueada = false;
  if ('speechSynthesis' in window){
    cargar();
    speechSynthesis.onvoiceschanged = cargar;
    /* Android puebla la lista tarde y de forma irregular: hay que insistir. */
    [200, 600, 1200, 2500, 4500, 8000].forEach(ms => setTimeout(cargar, ms));
  }

  /* Encola varias frases sin cortarlas entre sí: así una sola instrucción
     puede empezar en español y terminar con la palabra extranjera bien dicha. */
  function hablar(partes){
    try{
      /* Chrome se queda "pausado" solo; hay que reanimarlo antes de hablar. */
      try{ speechSynthesis.resume(); }catch(e){}
      /* Cancelar cuando no hay nada sonando rompe el audio en Android. */
      const venia = speechSynthesis.speaking || speechSynthesis.pending;
      if (venia) speechSynthesis.cancel();
      const lanzar = () => partes.forEach(p=>{
        if (!p.t) return;
        const k = CLAVES_IDIOMA.includes(p.l) ? p.l : 'es';
        const u = new SpeechSynthesisUtterance(p.t);
        const v = elegidas[k];
        if (v){ u.voice = v; u.lang = v.lang; }
        else u.lang = IDIOMAS[k].respaldo;
        /* El idioma extranjero un poco más lento: es el que están aprendiendo. */
        u.rate = velocidad * (k === 'es' ? 1 : 0.88);
        u.pitch = 1.0;   /* pitch alto es justo lo que suena a robot */
        u.volume = 1;
        speechSynthesis.speak(u);
      });
      /* Tras un cancel, Android ignora el speak inmediato: hay que respirar. */
      if (venia) setTimeout(lanzar, 80); else lanzar();
    }catch(e){}
  }

  return {
    conectar(a, p){
      ajustes = a; persistir = p;
      if (typeof ajustes.velocidad === 'number') velocidad = ajustes.velocidad;
      if (typeof ajustes.vozActiva === 'boolean') activa = ajustes.vozActiva;
      cargar();
    },
    /* Acepta un texto en español o una lista de partes con idioma. */
    decir(texto, forzar){
      if ((!activa && !forzar) || !('speechSynthesis' in window) || !texto) return;
      const partes = Array.isArray(texto) ? texto : [{t:texto, l:'es'}];
      ultima = partes;
      hablar(partes);
    },
    repetir(){ if (ultima) this.decir(ultima, true); },
    callar(){ try{ speechSynthesis.cancel(); }catch(e){} },
    alternar(){
      activa = !activa;
      if (!activa) this.callar();
      if (ajustes){ ajustes.vozActiva = activa; persistir && persistir(); }
      return activa;
    },
    estaActiva(){ return activa; },
    /* Android e iOS no dejan hablar hasta que el usuario toca la pantalla.
       Se manda una frase muda en el primer toque para abrir el permiso. */
    desbloquear(){
      if (desbloqueada || !('speechSynthesis' in window)) return;
      try{
        const u = new SpeechSynthesisUtterance(' ');
        u.volume = 0; u.rate = 2;
        speechSynthesis.speak(u);
        desbloqueada = true;
      }catch(e){}
      cargar();
    },
    estaDesbloqueada(){ return desbloqueada; },
    cuantas(){ return CLAVES_IDIOMA.reduce((n,k)=>n+listas[k].length, 0); },
    lista(k){ k = k || 'es'; if (!listas[k].length) cargar(); return listas[k]; },
    actual(k){ return elegidas[k || 'es']; },
    usar(k, v){
      elegidas[k] = v;
      if (ajustes){ ajustes['voz_'+k] = v.voiceURI; persistir && persistir(); }
    },
    ritmo(x){
      velocidad = x;
      if (ajustes){ ajustes.velocidad = x; persistir && persistir(); }
    },
    ritmoActual(){ return velocidad; },
    hayVoces(){ return this.lista('es').length > 0; }
  };
})();

function lienzoVacio(){
  return Array.from({length:LIENZO_AL}, () => new Array(LIENZO_AN).fill('.'));
}
function pegar(m, mapa, ox, oy, soloVacio){
  mapa.forEach((fila,y)=>{
    for (let x=0;x<fila.length;x++){
      const c = fila[x];
      if (c === '.') continue;
      const fy = y+oy, fx = x+ox;
      if (fy < 0 || fy >= LIENZO_AL || fx < 0 || fx >= LIENZO_AN) continue;
      if (soloVacio && m[fy][fx] !== '.') continue;
      m[fy][fx] = c;
    }
  });
}

function dibujarAvatar(cfg, px, animar, equipado){
  const eq = equipado || {};
  const m = lienzoVacio();
  const paleta = {
    x:'#1A1220',
    H: tintar(cfg.pelo, 1.35), h: cfg.pelo,
    s: cfg.piel, S: tintar(cfg.piel, .84),
    e:'#22283A', m: tintar(cfg.piel, .68),
    r: cfg.ropa, R: tintar(cfg.ropa, 1.22),
    p: cfg.pantalon, b:'#3E2C1C', '.':null
  };
  const usar = id => {
    const pz = PIEZAS[id];
    if (!pz) return null;
    Object.assign(paleta, pz.paleta);
    return pz;
  };
  /* La capa va detrás: solo pinta donde el cuerpo no tapa. */
  const capa = eq.espalda && usar(eq.espalda);
  if (capa) pegar(m, capa.mapa, capa.ox, capa.oy, true);

  pegar(m, SPRITE, BASE_X, BASE_Y);

  ['cabeza','mano','companero'].forEach(r=>{
    const pz = eq[r] && usar(eq[r]);
    if (pz) pegar(m, pz.mapa, pz.ox, pz.oy);
  });

  const cont = document.createElement('div');
  cont.className = 'avatar' + (animar && !REDUCIR ? ' anim-idle' : '');
  cont.style.gridTemplateColumns = `repeat(${LIENZO_AN},${px}px)`;
  cont.style.width = (LIENZO_AN*px)+'px';
  m.forEach(fila=>{
    fila.forEach(c=>{
      const i = document.createElement('i');
      i.style.width = px+'px'; i.style.height = px+'px';
      const col = paleta[c];
      if (col){
        i.style.background = col;
        i.style.boxShadow = 'inset 0 1px 0 rgba(255,255,255,.10)';
        if (c === 'e') i.className = 'ojo';
      }
      cont.appendChild(i);
    });
  });
  return cont;
}

/* ============================ core/Dificultad ============================ */
const Dificultad = (() => {
  let seguidos = 0, fallos = 0, recientes = [];
  return {
    reiniciar(){ seguidos = 0; fallos = 0; recientes = []; },
    acierto(){ seguidos++; fallos = 0; },
    fallo(){ fallos++; seguidos = 0; },
    /* Se llama al pasar de reto: guarda si ese reto costó trabajo. */
    cerrarPregunta(fallada){
      recientes.push(fallada ? 1 : 0);
      if (recientes.length > 3) recientes.shift();
    },
    sugiereAvanzar(){ return seguidos >= 3; },
    /* El andamio no puede depender de fallos seguidos: para avanzar hay que
       acertar, y ese acierto borraría el contador. Mira el reto anterior. */
    necesitaRepaso(){
      return recientes.length > 0 && recientes[recientes.length-1] === 1;
    }
  };
})();

/* ============================ core/Desempeno ============================ */
/* Guardar solo la mejor cantidad de estrellas no dice nada de dónde batallan.
   Aquí se acumula cómo le ha ido de verdad en cada nivel. */
const Desempeno = {
  registrar(prog, nivelId, aciertos, errores, temas){
    const st = prog.stats[nivelId] || (prog.stats[nivelId] = {
      intentos:0, aciertos:0, errores:0, ultimas:[], temas:[]
    });
    st.intentos++;
    st.aciertos += aciertos;
    st.errores  += errores;
    const total = aciertos + errores;
    st.ultimas.push(total ? Math.round(aciertos/total*100) : 100);
    if (st.ultimas.length > 8) st.ultimas.shift();
    /* Los enunciados fallados quedan guardados para el repaso futuro. */
    (temas || []).forEach(t=>{ if (!st.temas.includes(t)) st.temas.push(t); });
    if (st.temas.length > 12) st.temas.splice(0, st.temas.length-12);
    st.fecha = new Date().toISOString().slice(0,10);
    return st;
  },
  /* Precisión de los últimos intentos, que es lo que importa hoy. */
  precision(prog, nivelId){
    const st = prog.stats && prog.stats[nivelId];
    if (!st || !st.ultimas.length) return null;
    const recientes = st.ultimas.slice(-3);
    return Math.round(recientes.reduce((a,b)=>a+b,0) / recientes.length);
  },
  necesitaPractica(prog, nivelId){
    const pr = this.precision(prog, nivelId);
    return pr !== null && pr < 70;
  }
};

/* Resumen de un bioma completo, para el panel y para el repaso. */
function resumenBioma(perfil, bio, edad){
  const prog = perfil.biomas[bio.id];
  const niveles = bio.niveles(edad);
  let ac = 0, er = 0, jugados = 0, peor = null;
  niveles.forEach(nv=>{
    const st = prog.stats[nv.id];
    if (!st) return;
    jugados++; ac += st.aciertos; er += st.errores;
    const pr = Desempeno.precision(prog, nv.id);
    if (pr !== null && (!peor || pr < peor.pr)) peor = { nv, pr };
  });
  const estrellas = Object.keys(prog.estrellas)
    .reduce((a,k)=>a + (prog.estrellas[k]||0), 0);
  return {
    jugados, total:niveles.length, peor, estrellas,
    respondidas: ac + er,
    precision: (ac+er) ? Math.round(ac/(ac+er)*100) : null
  };
}

/* Niveles donde ya hay historial, pesados por lo mucho que cuestan. */
function fuentesDebiles(perfil, edad){
  const fuentes = [];
  BIOMAS.forEach(bio=>{
    const prog = perfil.biomas[bio.id];
    if (!prog) return;
    bio.niveles(edad).forEach(nv=>{
      const pr = Desempeno.precision(prog, nv.id);
      if (pr === null) return;
      /* 100% pesa 1; 40% pesa 7. Lo que más cuesta sale más seguido. */
      fuentes.push({ bio, nv, pr, peso: Math.max(1, Math.round((105-pr)/10)) });
    });
  });
  return fuentes;
}
function elegirPonderado(lista){
  const total = lista.reduce((a,f)=>a+f.peso, 0);
  let n = Math.random()*total;
  for (const f of lista){ n -= f.peso; if (n <= 0) return f; }
  return lista[lista.length-1];
}

function opcionesNumero(correcto, cantidad, max, conPuntos){
  const set = new Set([correcto]);
  let intentos = 0;
  while (set.size < cantidad && intentos < 60){
    intentos++;
    const d = correcto + az(-3,3);
    if (d < 0 || d > max || d === correcto) continue;
    set.add(d);
  }
  let n = 0;
  while (set.size < cantidad){ if (n !== correcto && n <= max) set.add(n); n++; }
  return mezclar([...set]).map(v => ({ etiqueta:String(v), puntos: conPuntos ? v : 0, valor:v }));
}

function armar(texto, hablado, visual, opciones, correcto){
  return { texto, hablado: hablado || texto, visual, opciones,
           respuesta: opciones.findIndex(o => o.valor === correcto) };
}

const DE3MAS      = PALABRAS.filter(w => w.s.length >= 3);
const TODAS_SILABAS = [...new Set(PALABRAS.flatMap(w => w.s))];

const tomar = a => a[az(0, a.length-1)];

/* n elementos distintos de una lista, excluyendo los que ya están */
function distintos(lista, n, fuera, clave){
  const k = clave || (x => x);
  const usados = new Set(fuera.map(k));
  const res = [];
  let giros = 0;
  while (res.length < n && giros < 400){
    giros++;
    const c = tomar(lista);
    if (usados.has(k(c))) continue;
    usados.add(k(c)); res.push(c);
  }
  return res;
}

/* Cambia una vocal: genera confusiones reales (casa → cosa, cesa) */
function variarVocal(palabra){
  const base = sinAcento(palabra);
  const pos = [];
  for (let i=0;i<base.length;i++) if ('aeiou'.includes(base[i])) pos.push(i);
  if (!pos.length) return null;
  const i = tomar(pos);
  const otras = 'aeiou'.split('').filter(v => v !== base[i]);
  return base.slice(0,i) + tomar(otras) + base.slice(i+1);
}

function opcionesTexto(correcta, distractoras, chico){
  const lista = mezclar([correcta, ...distractoras]);
  return lista.map(t => ({ etiqueta: MAYUS(t), valor:t, chico: !!chico }));
}

const LETRAS_GRANDE = [
  { id:1, nombre:'La letra que falta', icono:'🔤', preguntas:6, gen(){
      const w = tomar(PLANAS);
      const base = sinAcento(w.p);

      const otras = distintos(LETRAS_FACILES, 3, [l]);
      const ops = mezclar([l, ...otras]).map(x => ({etiqueta:x, valor:x}));
      const letras = MAYUS(base).split('');
      letras[i] = null;
      return { texto:'¿Qué letra falta?', hablado:`${w.p}. ¿Qué letra falta?`,
               visual:{tipo:'letras', e:w.e, partes:letras},
               opciones:ops, respuesta:ops.findIndex(o=>o.valor===l) }; }},

  { id:2, nombre:'La primera letra', icono:'🅰️', preguntas:6, gen(){
      const w = tomar(PLANAS);
      const l = MAYUS(sinAcento(w.p)[0]);
      const otras = distintos(LETRAS_FACILES, 3, [l]);
      const ops = mezclar([l, ...otras]).map(x => ({etiqueta:x, valor:x}));
      return { texto:'¿Con qué letra empieza?', hablado:`${w.p}. ¿Con qué letra empieza?`,
               visual:{tipo:'emoji', e:w.e}, opciones:ops, respuesta:ops.findIndex(o=>o.valor===l) }; }},

  { id:3, nombre:'La sílaba que falta', icono:'🧩', preguntas:6, gen(){
      const w = tomar(DE3MAS);
      const i = az(0, w.s.length-1);
      const falta = w.s[i];
      const otras = distintos(TODAS_SILABAS, 3, [falta]);
      const ops = mezclar([falta, ...otras]).map(x => ({etiqueta:MAYUS(x), valor:x, chico:true}));
      const partes = w.s.slice(); partes[i] = null;
      return { texto:'¿Qué sílaba falta?', hablado:`${w.p}. ¿Qué sílaba falta?`,
               visual:{tipo:'silabas', e:w.e, partes},
               opciones:ops, respuesta:ops.findIndex(o=>o.valor===falta) }; }},

  { id:4, nombre:'Lee con cuidado', icono:'👀', preguntas:6, gen(){
      const w = tomar(PLANAS);
      const base = sinAcento(w.p);
      const vistos = new Set([base]);
      const trampas = [];
      let giros = 0;
      while (trampas.length < 3 && giros < 60){
        giros++;
        const v = variarVocal(base);
        if (!v || vistos.has(v)) continue;
        vistos.add(v); trampas.push(v);
      }
      while (trampas.length < 3){
        const otra = tomar(PLANAS).p;
        if (!vistos.has(otra)){ vistos.add(otra); trampas.push(otra); }
      }
      const ops = opcionesTexto(base, trampas, true);
      return { texto:'¿Cuál está bien escrita?', hablado:`${w.p}. ¿Cuál está bien escrita?`,
               visual:{tipo:'emoji', e:w.e}, opciones:ops, respuesta:ops.findIndex(o=>o.valor===base) }; }},

  { id:5, nombre:'Cuenta las sílabas', icono:'👏', preguntas:6, gen(){
      const w = tomar(PALABRAS);
      const n = w.s.length;
      const ops = mezclar([1,2,3,4]).map(x => ({etiqueta:String(x), valor:x}));
      return { texto:`¿Cuántas sílabas tiene ${MAYUS(w.p)}?`,
               hablado:`${w.p}. ¿Cuántas sílabas tiene?`,
               visual:{tipo:'emoji', e:w.e}, opciones:ops, respuesta:ops.findIndex(o=>o.valor===n) }; }},

  { id:6, nombre:'El orden correcto', icono:'🔀', preguntas:6, gen(){
      const w = tomar(DE3MAS);
      const bien = w.s.join('');
      const vistos = new Set([bien]);
      const revueltas = [];
      let giros = 0;
      while (revueltas.length < 3 && giros < 60){
        giros++;
        const r = mezclar(w.s).join('');
        if (vistos.has(r)) continue;
        vistos.add(r); revueltas.push(r);
      }
      while (revueltas.length < 3){
        const otra = tomar(DE3MAS);
        const r = mezclar(otra.s).join('');
        if (!vistos.has(r)){ vistos.add(r); revueltas.push(r); }
      }
      const ops = opcionesTexto(bien, revueltas, true);
      return { texto:'¿Cuál está bien escrita?', hablado:`${w.p}. ¿Cuál está bien escrita?`,
               visual:{tipo:'emoji', e:w.e}, opciones:ops, respuesta:ops.findIndex(o=>o.valor===bien) }; }},

  { id:7, nombre:'Encuentra la rima', icono:'🎵', preguntas:6, gen(){
      const r = tomar(RIMAS);
      const cola = sinAcento(r.a).slice(-2);
      const fuera = new Set([r.a, r.b]);
      const otras = [];
      let giros = 0;
      /* Ninguna distractora puede rimar también: se descarta por terminación. */
      while (otras.length < 3 && giros < 300){
        giros++;
        const c = tomar(PALABRAS).p;
        if (fuera.has(c) || sinAcento(c).slice(-2) === cola) continue;
        fuera.add(c); otras.push(c);
      }
      const ops = opcionesTexto(r.b, otras, true);
      return { texto:`¿Cuál rima con ${MAYUS(r.a)}?`, hablado:`¿Cuál rima con ${r.a}?`,
               visual:{tipo:'emoji', e:r.e}, opciones:ops, respuesta:ops.findIndex(o=>o.valor===r.b) }; }},

  { id:8, nombre:'Completa la frase', icono:'📜', preguntas:6, gen(){
      const f = tomar(FRASES);
      const otras = distintos(POOL_FRASES, 3, [f.r]);
      const ops = opcionesTexto(f.r, otras, true);
      return { texto:f.t, hablado:f.t.replace('___','...'),
               visual:null, opciones:ops, respuesta:ops.findIndex(o=>o.valor===f.r) }; }}
];

/* Arma una pregunta de banco: respuesta correcta + distractores propios */
function deBanco(banco, visual){
  const f = tomar(banco);
  const ops = mezclar([f.r, ...f.d]).map(x => ({etiqueta:x, valor:x, chico:true}));
  return { texto:f.t, hablado:f.hq || f.t, visual: visual ? visual(f) : null,
           opciones:ops, respuesta:ops.findIndex(o => o.valor === f.r) };
}

   ve el fenómeno formarse y solo después se le pregunta. */

/* --- utilidades de dibujo --- */
function cielo(g, W, H, arriba, abajo){
  const d = g.createLinearGradient(0,0,0,H);
  d.addColorStop(0, arriba); d.addColorStop(1, abajo);
  g.fillStyle = d; g.fillRect(0,0,W,H);
}
function bloqueP(g, x, y, an, al, color){
  g.fillStyle = color; g.fillRect(x,y,an,al);
  g.fillStyle = 'rgba(255,255,255,.16)'; g.fillRect(x,y,an,3);
  g.fillStyle = 'rgba(0,0,0,.20)'; g.fillRect(x,y+al-3,an,3);
}
function casita(g, x, sueloY, esc, inclina){
  g.save(); g.translate(x, sueloY); g.rotate(inclina || 0);
  bloqueP(g, -13*esc, -20*esc, 26*esc, 20*esc, '#C9A87C');
  g.fillStyle = '#9B3B2E';
  g.beginPath(); g.moveTo(-17*esc,-20*esc); g.lineTo(0,-32*esc); g.lineTo(17*esc,-20*esc); g.closePath(); g.fill();
  g.fillStyle = '#4A6FA0'; g.fillRect(-5*esc,-14*esc,10*esc,9*esc);
  g.restore();
}
function chispa(st, x, y, vx, vy, col, vida){
  st.p.push({x,y,vx,vy,col,vida,max:vida});
}
function moverChispas(g, st, grav){
  st.p = st.p.filter(q => q.vida > 0);
  st.p.forEach(q=>{
    q.x += q.vx; q.y += q.vy; q.vy += (grav == null ? 0.16 : grav); q.vida--;
    g.globalAlpha = Math.max(0, q.vida / q.max);
    g.fillStyle = q.col;
    g.fillRect(q.x-2, q.y-2, 4, 4);
  });
  g.globalAlpha = 1;
  if (st.p.length > 340) st.p.splice(0, st.p.length-340);
}

/* --- 1. VOLCÁN --- */
function dibujaVolcan(g, W, H, v, t, st){
  cielo(g, W, H, v >= 70 ? '#3A1E22' : '#22304C', '#5A6E96');
  const sueloY = H-16, cx = W/2, alto = H*0.58, ancho = W*0.66, pasos = 9;
  bloqueP(g, 0, sueloY, W, 16, '#4E7A33');
  for (let i=0;i<pasos;i++){
    const f = i/pasos, semi = (ancho/2)*(1-f*0.82);
    const y = sueloY - (alto/pasos)*(i+1);
    bloqueP(g, cx-semi, y, semi*2, alto/pasos+1, i%2 ? '#6B5540' : '#7A6149');
  }
  const llen = v/100;
  /* cámara magmática */
  g.fillStyle = `rgba(226,90,34,${0.30 + 0.70*llen})`;
  g.beginPath();
  g.ellipse(cx, sueloY-6, 30+30*llen, 12+12*llen, 0, 0, Math.PI*2);
  g.fill();
  /* chimenea que se va llenando */
  const chAlto = alto*llen;
  if (chAlto > 2){
    g.fillStyle = '#F06A24';
    g.fillRect(cx-7, sueloY-6-chAlto, 14, chAlto);
    g.fillStyle = `rgba(255,220,120,${0.4+0.5*Math.sin(t/140)})`;
    g.fillRect(cx-3, sueloY-6-chAlto, 6, chAlto);
  }
  if (v >= 70){
    const fuerza = (v-70)/30;
    for (let i=0;i<2+Math.round(fuerza*4);i++)
      chispa(st, cx+(Math.random()-.5)*16, sueloY-alto,
             (Math.random()-.5)*(2+fuerza*3), -(3+Math.random()*4+fuerza*3),
             ['#FFD066','#F06A24','#D14B3C'][i%3], 60);
    /* lava escurriendo */
    g.fillStyle = '#E8622A';
    const largo = alto*0.5*fuerza;
    g.fillRect(cx-4, sueloY-alto, 8, largo);
    /* columna de humo */
    g.fillStyle = 'rgba(90,80,80,.45)';
    for (let i=0;i<7;i++){
      const y = sueloY-alto-14-i*15, r = 9+i*4+Math.sin(t/300+i)*3;
      g.beginPath(); g.arc(cx+Math.sin(t/420+i)*12, y, r, 0, Math.PI*2); g.fill();
    }
  }
  moverChispas(g, st);
}

/* --- 2. SISMO --- */
function dibujaSismo(g, W, H, v, t, st){
  const rompe = v >= 70;
  const sacude = rompe ? Math.sin(t/22)*(v-70)/5 : 0;
  g.save(); g.translate(sacude, 0);
  cielo(g, W, H, '#22304C', '#6B7FA6');
  const sueloY = H*0.52;
  /* dos placas empujándose */
  const empuje = v/100 * 16;
  bloqueP(g, -20, sueloY, W/2+20-empuje, H-sueloY, '#7A6149');
  bloqueP(g, -20, sueloY, W/2+20-empuje, 8, '#4E7A33');
  bloqueP(g, W/2+empuje, sueloY + (rompe ? 8 : 0), W/2+20, H-sueloY, '#6B5540');
  bloqueP(g, W/2+empuje, sueloY + (rompe ? 8 : 0), W/2+20, 8, '#4E7A33');
  /* fricción en la falla */
  g.fillStyle = rompe ? '#FFD066' : `rgba(220,90,50,${v/140})`;
  g.fillRect(W/2-empuje-2, sueloY, 4+empuje*2, H-sueloY);
  /* flechas de empuje */
  g.fillStyle = 'rgba(255,255,255,.5)';
  g.fillRect(W*0.18, sueloY+30, 26, 4); g.fillRect(W*0.18+26, sueloY+27, 4, 10);
  g.fillRect(W*0.82-26, sueloY+30, 26, 4); g.fillRect(W*0.82-30, sueloY+27, 4, 10);
  /* casas */
  const tam = Math.min(1, W/300);
  casita(g, W*0.22, sueloY, tam, rompe ? Math.sin(t/30)*0.10 : 0);
  casita(g, W*0.74, sueloY+(rompe?8:0), tam, rompe ? Math.sin(t/30+1.6)*0.12 : 0);
  /* ondas desde el epicentro */
  if (rompe){
    st.onda = (st.onda || 0) + 1.6;
    if (st.onda > 90) st.onda = 0;
    for (let k=0;k<3;k++){
      const r = st.onda + k*30;
      if (r > 90) continue;
      g.strokeStyle = `rgba(255,208,102,${0.55*(1-r/90)})`;
      g.lineWidth = 3;
      g.beginPath(); g.arc(W/2, sueloY, r, Math.PI, Math.PI*2); g.stroke();
    }
    g.fillStyle = '#FFD066';
    g.fillRect(W/2-4, sueloY-4, 8, 8);
  }
  g.restore();
}

/* --- 3. HURACÁN --- */
function dibujaHuracan(g, W, H, v, t, st){
  cielo(g, W, H, '#1B2B4C', '#3E5C86');
  const marY = H*0.66;
  const calor = Math.max(0, Math.min(1, (v-24)/8));
  /* el mar cambia de color con la temperatura */
  g.fillStyle = `rgb(${30+calor*55},${90+calor*40},${150-calor*35})`;
  g.fillRect(0, marY, W, H-marY);
  for (let i=0;i<W;i+=26){
    g.fillStyle = 'rgba(255,255,255,.12)';
    g.fillRect(i+Math.sin(t/300+i)*5, marY+8+Math.sin(t/220+i/30)*3, 16, 3);
  }
  /* vapor subiendo */
  if (v >= 26 && Math.random() < 0.4)
    chispa(st, Math.random()*W, marY, (Math.random()-.5), -0.7-Math.random(), 'rgba(255,255,255,.5)', 70);
  moverChispas(g, st, -0.004);

  if (v < 26){
    g.fillStyle = 'rgba(230,235,245,.5)';
    for (let i=0;i<3;i++) g.fillRect(W*0.15+i*W*0.26, H*0.22+i*10, 60, 14);
    return;
  }
  /* espiral que crece con el calor */
  const fuerza = (v-26)/6, cx = W/2, cy = marY*0.55;
  const rMax = (Math.min(W,H)*0.30)*(0.45+0.55*fuerza);
  const giro = t/(620-fuerza*340);
  g.save(); g.translate(cx, cy); g.rotate(giro);
  for (let b=0;b<5;b++){
    g.save(); g.rotate(b*Math.PI*2/5);
    for (let s=0;s<16;s++){
      const f = s/16, r = rMax*(0.18+f*0.9), ang = f*2.3;
      const x = Math.cos(ang)*r, y = Math.sin(ang)*r*0.62;
      g.fillStyle = `rgba(238,243,252,${0.75-f*0.45})`;
      const tam = 10*(1-f*0.55)*(0.6+0.4*fuerza);
      g.fillRect(x-tam/2, y-tam/2, tam, tam);
    }
    g.restore();
  }
  g.restore();
  /* el ojo aparece cuando el huracán ya está fuerte */
  if (v >= 29){
    g.fillStyle = '#20344F';
    g.beginPath(); g.ellipse(cx, cy, rMax*0.16, rMax*0.10, 0, 0, Math.PI*2); g.fill();
  }
}

/* --- 4. TORNADO --- */
function dibujaTornado(g, W, H, v, t, st){
  cielo(g, W, H, '#2A2438', '#7A6E86');
  const sueloY = H-22;
  bloqueP(g, 0, sueloY, W, 22, '#6E7A3E');
  /* nube de tormenta */
  g.fillStyle = '#3B3448';
  g.fillRect(0, 0, W, H*0.26);
  for (let i=0;i<W;i+=30){
    g.beginPath(); g.arc(i+15, H*0.26, 20, 0, Math.PI); g.fill();
  }
  /* aire caliente sube, aire frío baja */
  const mezcla = v/100;
  for (let i=0;i<5;i++){
    const x = W*0.10 + i*W*0.045;
    g.fillStyle = `rgba(226,110,60,${0.25+0.55*mezcla})`;
    const y = sueloY - 30 - ((t/9 + i*30) % 90);
    g.fillRect(x, y, 5, 16);
  }
  for (let i=0;i<5;i++){
    const x = W*0.78 + i*W*0.045;
    g.fillStyle = `rgba(90,150,225,${0.25+0.55*mezcla})`;
    const y = H*0.28 + ((t/9 + i*30) % 90);
    g.fillRect(x, y, 5, 16);
  }
  if (v < 60){
    casita(g, W/2, sueloY, Math.min(1, W/300), 0);
    return;
  }
  /* embudo */
  const fuerza = (v-60)/40, cx = W/2;
  const arriba = H*0.26, abajo = sueloY;
  const anchoA = 42*(0.5+0.5*fuerza), anchoB = 12*(0.5+0.5*fuerza);
  for (let i=0;i<=22;i++){
    const f = i/22;
    const y = arriba + (abajo-arriba)*f;
    const an = anchoA + (anchoB-anchoA)*f;
    const bal = Math.sin(t/160 + f*4)*16*f*fuerza;
    g.fillStyle = `rgba(200,196,212,${0.30+0.45*(1-f)})`;
    g.fillRect(cx+bal-an/2, y, an, (abajo-arriba)/22+1);
  }
  /* escombros girando en la base */
  if (Math.random() < 0.5)
    chispa(st, cx+(Math.random()-.5)*40, abajo, (Math.random()-.5)*4, -1-Math.random()*3,
           ['#8A7A5E','#6E7A3E','#C9A87C'][Math.floor(Math.random()*3)], 45);
  moverChispas(g, st, 0.06);
  casita(g, W*0.24, sueloY, Math.min(1, W/300), Math.sin(t/40)*0.06*fuerza);
}

/* --- 5. INUNDACIÓN --- */
function dibujaInundacion(g, W, H, v, t, st, ciudad){
  cielo(g, W, H, '#2E3A50', '#6B7A94');
  const sueloY = H*0.62;
  /* el suelo decide cuánta agua se absorbe */
  if (ciudad){
    bloqueP(g, 0, sueloY, W, H-sueloY, '#6B6E76');
    for (let i=0;i<W;i+=34){ g.fillStyle='rgba(0,0,0,.13)'; g.fillRect(i,sueloY,2,H-sueloY); }
  } else {
    bloqueP(g, 0, sueloY, W, H-sueloY, '#7A5B38');
    bloqueP(g, 0, sueloY, W, 9, '#4E7A33');
    g.fillStyle = '#2F5E22';
    [0.12,0.34,0.86].forEach(f=>{
      g.fillRect(W*f-3, sueloY-22, 6, 22);
      g.beginPath(); g.arc(W*f, sueloY-28, 13, 0, Math.PI*2); g.fill();
    });
  }
  casita(g, W*0.62, sueloY, Math.min(1, W/300), 0);
  /* lluvia */
  const gotas = Math.round(v/2.2);
  g.strokeStyle = 'rgba(170,205,245,.7)'; g.lineWidth = 2;
  for (let i=0;i<gotas;i++){
    const x = (i*79 + t/2.2) % W, y = ((i*137 + t*2.6) % (sueloY+30));
    g.beginPath(); g.moveTo(x,y); g.lineTo(x-2,y+9); g.stroke();
  }
  /* el agua sube: la tierra absorbe, el cemento no */
  const absorcion = ciudad ? 0.12 : 0.62;
  const nivel = Math.max(0, (v/100) * (1-absorcion) * (H-sueloY) * 2.4);
  if (nivel > 1){
    g.fillStyle = 'rgba(58,110,170,.72)';
    g.fillRect(0, sueloY-nivel, W, nivel + (H-sueloY));
    g.fillStyle = 'rgba(255,255,255,.22)';
    for (let i=0;i<W;i+=22)
      g.fillRect(i+Math.sin(t/240+i/26)*4, sueloY-nivel+Math.sin(t/180+i/30)*2, 13, 3);
  }
}

/* ============================ biomes/cosmos ============================ */
function fondoEstelar(g, W, H, st, t){
  g.fillStyle = '#070B16'; g.fillRect(0,0,W,H);
  if (!st.estrellas){
    st.estrellas = [];
    for (let i=0;i<80;i++)
      st.estrellas.push({x:Math.random(), y:Math.random(), r:Math.random()*1.5+0.6, f:Math.random()*6});
  }
  st.estrellas.forEach(e=>{
    g.globalAlpha = 0.30 + 0.70*Math.abs(Math.sin(e.f + t/900));
    g.fillStyle = '#FFFFFF';
    g.fillRect(e.x*W, e.y*H, e.r*1.7, e.r*1.7);
  });
  g.globalAlpha = 1;
}
function disco(g, x, y, r, color){
  g.fillStyle = color; g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill();
}
function astroSol(g, x, y, r, t){
  const d = g.createRadialGradient(x,y,r*0.2,x,y,r*2.4);
  d.addColorStop(0,'rgba(255,240,190,.95)');
  d.addColorStop(0.35,'rgba(255,190,60,.45)');
  d.addColorStop(1,'rgba(255,150,40,0)');
  g.fillStyle = d; g.beginPath(); g.arc(x,y,r*2.4,0,Math.PI*2); g.fill();
  disco(g, x, y, r*(1+0.03*Math.sin(t/420)), '#FFD066');
}

/* --- 1. ORBITAS Y GRAVEDAD --- */
function dibujaOrbita(g, W, H, v, t, st){
  fondoEstelar(g, W, H, st, t);
  const cx = W/2, cy = H/2, r0 = Math.min(W,H)*0.31;
  const reg = v < 30 ? 'cae' : v > 70 ? 'escapa' : 'orbita';
  if (st.r == null || st.reg !== reg){ st.r = r0; st.ang = 0; st.rastro = []; st.reg = reg; }
  if (reg === 'cae'){
    st.r -= (30-v)*0.012 + 0.05;
    if (st.r < 15){ st.r = r0; st.rastro = []; }
  } else if (reg === 'escapa'){
    st.r += (v-70)*0.05 + 0.2;
    if (st.r > Math.max(W,H)){ st.r = r0; st.rastro = []; }
  } else {
    const e = (v-50)/22;
    st.r = r0*(1 + 0.20*e*Math.sin(st.ang));
  }
  st.ang += 0.020*Math.pow(r0/Math.max(st.r,12), 1.5);
  const px = cx + Math.cos(st.ang)*st.r, py = cy + Math.sin(st.ang)*st.r*0.86;
  st.rastro.push({x:px, y:py});
  if (st.rastro.length > 110) st.rastro.shift();
  st.rastro.forEach((q,i)=>{
    g.globalAlpha = i/st.rastro.length*0.55;
    g.fillStyle = '#7FB4FF'; g.fillRect(q.x-1.5, q.y-1.5, 3, 3);
  });
  g.globalAlpha = 1;
  astroSol(g, cx, cy, Math.min(W,H)*0.075, t);
  disco(g, px, py, 7, '#5B9BEE');
  disco(g, px-2, py-2, 3, '#A9CCFF');
}

/* --- 2. FASES DE LA LUNA --- */
function caraLunar(g, cx, cy, r, k, derecha){
  disco(g, cx, cy, r, '#2B2F3C');
  g.save();
  g.beginPath(); g.arc(cx,cy,r,0,Math.PI*2); g.clip();
  g.fillStyle = '#EDE7D6';
  g.beginPath();
  if (derecha) g.arc(cx,cy,r,-Math.PI/2,Math.PI/2);
  else g.arc(cx,cy,r,Math.PI/2,Math.PI*1.5);
  g.closePath(); g.fill();
  g.fillStyle = k > 0 ? '#EDE7D6' : '#2B2F3C';
  g.beginPath(); g.ellipse(cx,cy,Math.abs(k)*r,r,0,0,Math.PI*2); g.fill();
  g.restore();
  g.strokeStyle = 'rgba(255,255,255,.25)'; g.lineWidth = 1;
  g.beginPath(); g.arc(cx,cy,r,0,Math.PI*2); g.stroke();
}
function dibujaFases(g, W, H, v, t, st){
  fondoEstelar(g, W, H, st, t);
  const ang = v*Math.PI/180;
  const cx = W*0.31, cy = H/2, R = Math.min(W*0.20, H*0.33);
  g.fillStyle = 'rgba(255,214,110,.45)';
  for (let i=0;i<6;i++) g.fillRect(0, H*0.12+i*H*0.145, W*0.09, 3);
  g.strokeStyle = 'rgba(255,255,255,.16)'; g.lineWidth = 1;
  g.beginPath(); g.ellipse(cx,cy,R,R*0.86,0,0,Math.PI*2); g.stroke();
  disco(g, cx, cy, 11, '#3B6FD4');
  disco(g, cx-3, cy-3, 4, '#7FB4FF');
  const mx = cx + Math.cos(ang)*R, my = cy + Math.sin(ang)*R*0.86;
  disco(g, mx, my, 7, '#2B2F3C');
  g.save(); g.beginPath(); g.arc(mx,my,7,0,Math.PI*2); g.clip();
  g.fillStyle = '#EDE7D6'; g.fillRect(mx-7, my-7, 7, 14);
  g.restore();
  g.fillStyle = 'rgba(255,255,255,.10)'; g.fillRect(W*0.56, H*0.12, 2, H*0.70);
  const vr = Math.min(W*0.13, H*0.27);
  caraLunar(g, W*0.78, H*0.46, vr, Math.cos(ang), Math.sin(ang) >= 0);
  g.fillStyle = 'rgba(255,255,255,.55)'; g.font = '11px sans-serif'; g.textAlign = 'center';
  g.fillText('desde arriba', cx, H-8);
  g.fillText('desde la Tierra', W*0.78, H-8);
  g.textAlign = 'left';
}

/* --- 3. ECLIPSE SOLAR --- */
function dibujaEclipse(g, W, H, v, t, st){
  fondoEstelar(g, W, H, st, t);
  const solX = W*0.13, solY = H/2, solR = Math.min(W,H)*0.10;
  const lunaX = W*0.50, lunaY = H/2 + v*H*0.0032, lunaR = 9;
  const tieX = W*0.84, tieY = H/2, tieR = Math.min(W,H)*0.13;
  astroSol(g, solX, solY, solR, t);
  g.fillStyle = 'rgba(10,14,26,.72)';
  g.beginPath();
  g.moveTo(lunaX, lunaY-lunaR); g.lineTo(lunaX, lunaY+lunaR);
  g.lineTo(W, lunaY + (lunaY-solY)*1.9 + lunaR*0.4);
  g.lineTo(W, lunaY + (lunaY-solY)*1.9 - lunaR*0.4);
  g.closePath(); g.fill();
  disco(g, tieX, tieY, tieR, '#3B6FD4');
  g.save(); g.beginPath(); g.arc(tieX,tieY,tieR,0,Math.PI*2); g.clip();
  g.fillStyle = 'rgba(255,255,255,.14)'; g.fillRect(tieX-tieR, tieY-tieR, tieR, tieR*2);
  if (Math.abs(v) < 13){
    g.fillStyle = 'rgba(6,8,16,.88)';
    g.beginPath(); g.arc(tieX-tieR*0.4, tieY+v*0.30, tieR*0.30, 0, Math.PI*2); g.fill();
  }
  g.restore();
  disco(g, lunaX, lunaY, lunaR, '#8A8D99');
  const br = Math.min(W,H)*0.085, bx = W-br-14, by = br+14;
  g.fillStyle = 'rgba(8,12,24,.85)';
  g.fillRect(bx-br-6, by-br-6, br*2+12, br*2+12);
  disco(g, bx, by, br, '#FFD066');
  disco(g, bx + v*0.028*br, by + v*0.030*br, br*0.96, '#1B1F2C');
  g.strokeStyle = 'rgba(255,255,255,.3)'; g.lineWidth = 1;
  g.strokeRect(bx-br-6, by-br-6, br*2+12, br*2+12);
}

/* --- 4. VIDA DE UNA ESTRELLA --- */
function dibujaEstrella(g, W, H, v, t, st){
  fondoEstelar(g, W, H, st, t);
  const y = H*0.44;
  const rBase = 10 + Math.log(v)*6;
  const col = v < 3 ? '#FFD066' : v < 9 ? '#FFF0C2' : '#BFD8FF';
  g.font = '11px sans-serif'; g.textAlign = 'center';
  disco(g, W*0.17, y, rBase*(1+0.04*Math.sin(t/380)), col);
  g.fillStyle = 'rgba(255,255,255,.55)';
  g.fillText('hoy', W*0.17, y + rBase + 20);
  g.fillStyle = 'rgba(255,255,255,.35)';
  g.fillRect(W*0.30, y-2, W*0.06, 4);
  g.fillRect(W*0.62, y-2, W*0.06, 4);
  if (v < 9){
    disco(g, W*0.49, y, rBase*2.1, '#E0563C');
    g.fillStyle = 'rgba(255,255,255,.55)';
    g.fillText('gigante roja', W*0.49, y + rBase*2.1 + 18);
  } else {
    const brillo = 0.55 + 0.45*Math.abs(Math.sin(t/260));
    const d = g.createRadialGradient(W*0.49,y,2,W*0.49,y,rBase*2.5);
    d.addColorStop(0, 'rgba(255,255,255,' + brillo + ')');
    d.addColorStop(0.4, 'rgba(255,200,120,.6)');
    d.addColorStop(1, 'rgba(255,90,40,0)');
    g.fillStyle = d;
    g.beginPath(); g.arc(W*0.49, y, rBase*2.5, 0, Math.PI*2); g.fill();
    if (Math.random() < 0.3)
      chispa(st, W*0.49, y, (Math.random()-.5)*5, (Math.random()-.5)*5, '#FFD066', 40);
    g.fillStyle = 'rgba(255,255,255,.6)';
    g.fillText('supernova', W*0.49, y + rBase*2.5 + 18);
  }
  if (v < 9){
    disco(g, W*0.82, y, 7, '#E8F0FF');
    g.fillStyle = 'rgba(255,255,255,.55)';
    g.fillText('enana blanca', W*0.82, y + 26);
  } else if (v < 21){
    disco(g, W*0.82, y, 5, '#CFE2FF');
    g.strokeStyle = 'rgba(140,200,255,.6)'; g.lineWidth = 2;
    g.beginPath(); g.arc(W*0.82, y, 11+Math.sin(t/200)*2, 0, Math.PI*2); g.stroke();
    g.fillStyle = 'rgba(255,255,255,.55)';
    g.fillText('estrella de neutrones', W*0.82, y + 28);
  } else {
    disco(g, W*0.82, y, 13, '#05070E');
    g.strokeStyle = '#FFB347'; g.lineWidth = 2;
    g.beginPath(); g.arc(W*0.82, y, 15, 0, Math.PI*2); g.stroke();
    g.fillStyle = 'rgba(255,255,255,.55)';
    g.fillText('agujero negro', W*0.82, y + 32);
  }
  moverChispas(g, st, 0);
  g.textAlign = 'left';
}

/* --- 5. AGUJERO NEGRO --- */
function dibujaAgujero(g, W, H, v, t, st){
  fondoEstelar(g, W, H, st, t);
  const cx = W/2, cy = H/2;
  const rh = 8 + v*0.42;
  const rFoton = rh*1.5;
  for (let i=0;i<52;i++){
    const a = (i/52)*Math.PI*2 + t/700;
    const rr = rFoton*1.5 + (i%7)*rh*0.20;
    const x = cx + Math.cos(a)*rr, y = cy + Math.sin(a)*rr*0.28;
    const cal = (Math.sin(a)+1)/2;
    g.fillStyle = 'rgba(255,' + Math.round(140+cal*90) + ',' + Math.round(40+cal*70) + ',' + (0.35+0.45*cal) + ')';
    g.fillRect(x-2, y-2, 4.5, 4.5);
  }
  for (let i=0;i<7;i++){
    const b = (i-3)*rh*0.85;
    const tragado = Math.abs(b) < rFoton;
    g.strokeStyle = tragado ? 'rgba(255,120,80,.55)' : 'rgba(180,215,255,.55)';
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(W, cy + b);
    if (tragado) g.quadraticCurveTo(cx + rh*2, cy + b, cx + rh*0.2, cy + b*0.25);
    else g.quadraticCurveTo(cx, cy + b*0.35, 0, cy + b*1.9);
    g.stroke();
  }
  g.strokeStyle = 'rgba(255,196,110,.85)'; g.lineWidth = 3;
  g.beginPath(); g.arc(cx, cy, rFoton, 0, Math.PI*2); g.stroke();
  disco(g, cx, cy, rh, '#04060C');
  g.fillStyle = 'rgba(255,255,255,.5)'; g.font = '11px sans-serif'; g.textAlign = 'center';
  g.fillText('horizonte de sucesos', cx, cy + rFoton + 22);
  g.textAlign = 'left';
}

/* --- 6. LAS ESTACIONES --- */
function tierraInclinada(g, cx, cy, r, incl, ladoSol, etiqueta){
  const a = incl*Math.PI/180;
  disco(g, cx, cy, r, '#22375C');
  g.save(); g.beginPath(); g.arc(cx,cy,r,0,Math.PI*2); g.clip();
  g.fillStyle = '#4E86D6';
  g.fillRect(ladoSol < 0 ? cx-r : cx, cy-r, r, r*2);
  g.restore();
  g.strokeStyle = '#FFD066'; g.lineWidth = 2;
  g.beginPath();
  g.moveTo(cx - Math.sin(a)*r*1.35, cy - Math.cos(a)*r*1.35);
  g.lineTo(cx + Math.sin(a)*r*1.35, cy + Math.cos(a)*r*1.35);
  g.stroke();
  disco(g, cx - Math.sin(a)*r*1.35, cy - Math.cos(a)*r*1.35, 3.5, '#FFF3C4');
  g.fillStyle = 'rgba(255,255,255,.6)'; g.font = '11px sans-serif'; g.textAlign = 'center';
  g.fillText(etiqueta, cx, cy + r + 20);
  g.textAlign = 'left';
}
function dibujaEstaciones(g, W, H, v, t, st){
  fondoEstelar(g, W, H, st, t);
  const cy = H*0.44, r = Math.min(W*0.085, H*0.17);
  astroSol(g, W/2, cy, Math.min(W,H)*0.072, t);
  tierraInclinada(g, W*0.16, cy, r, -v, +1, 'junio');
  tierraInclinada(g, W*0.84, cy, r, -v, -1, 'diciembre');
  g.fillStyle = 'rgba(255,255,255,.55)'; g.font = '11px sans-serif'; g.textAlign = 'center';
  const norte = v < 4 ? ['igual','igual'] : ['verano','invierno'];
  g.fillText('Norte: ' + norte[0], W*0.16, cy + r + 36);
  g.fillText('Norte: ' + norte[1], W*0.84, cy + r + 36);
  if (Math.abs(v-23) < 2){
    g.fillStyle = '#FFD066';
    g.fillText('asi es la Tierra de verdad', W/2, H-10);
  }
  g.textAlign = 'left';
}

function el(tag, clase, texto){
  const n = document.createElement(tag);
  if (clase) n.className = clase;
  if (texto != null) n.textContent = texto;
  return n;
}

function pantalla(){
  if (typeof Simulacion !== 'undefined') Simulacion.detener();
  const previo = app.firstElementChild;
  if (previo) previo.remove();
  const p = el('div','pantalla entra');
  app.appendChild(p);
  app.scrollTop = 0;
  return p;
}

function escalonar(contenedor, base, paso){
  [...contenedor.children].forEach((c,i)=>{ c.style.animationDelay = (base + i*paso)+'ms'; });
}

function barra(titulo, sub, alVolver, extra){
  const b = el('div','barra');
  if (alVolver){
    const btn = el('button','losa icono-btn','◀');
    btn.setAttribute('aria-label','Volver');
    btn.onclick = () => { Audio_.toque(); Voz.callar(); alVolver(); };
    b.appendChild(btn);
  }
  const r = el('div','rotulo');
  r.appendChild(el('b', null, titulo));
  if (sub) r.appendChild(el('span', null, sub));
  b.appendChild(r);
  if (extra) b.appendChild(extra);
  return b;
}

  const cajaPron = el('div','control');

    campo.value = nombreHablado(id);

    campo.onchange = () => {

  [['Lenta',0.78],['Normal',0.95],['Rápida',1.12]].forEach(([n,x])=>{
    const activo = Math.abs(Voz.ritmoActual() - x) < 0.02;

/* ---------- Laboratorio: pantalla de experimento ---------- */
const Simulacion = (() => {
  let raf = null;
  return {
    correr(lienzo, fen, leer){
      this.detener();
      const g = lienzo.getContext('2d');
      const st = { p:[], onda:0 };
      const t0 = performance.now();
      const paso = () => {
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        const anchoCSS = lienzo.clientWidth || 320;
        const altoCSS  = Math.round(anchoCSS * 0.62);
        if (lienzo.width !== Math.round(anchoCSS*dpr)){
          lienzo.width  = Math.round(anchoCSS*dpr);
          lienzo.height = Math.round(altoCSS*dpr);
          lienzo.style.height = altoCSS+'px';
        }
        g.setTransform(dpr,0,0,dpr,0,0);
        const d = leer();
        fen.dibuja(g, anchoCSS, altoCSS, d.valor, performance.now()-t0, st, d.alterno);
        raf = requestAnimationFrame(paso);
      };
      paso();
    },
    detener(){ if (raf){ cancelAnimationFrame(raf); raf = null; } }
  };
})();

function vistaExperimento(bio, fen){
  const p = pantalla();
  const perfil = Perfiles.actual();
  const edad = NINOS[perfil.id].perfilEdad;
  const est = perfil.biomas[bio.id].estrellas[fen.id] || 0;

  p.appendChild(barra(`${fen.icono} ${fen.nombre}`, fen.resumen,
                      () => vistaNiveles(bio.id), medidorPerfil()));

  const caja = el('div','lienzo');
  const lienzo = document.createElement('canvas');
  caja.appendChild(lienzo);
  const medida = el('div','medida');
  const estado = el('div','estado');
  caja.appendChild(medida); caja.appendChild(estado);
  p.appendChild(caja);

  const ctrl = el('div','control');
  ctrl.style.marginTop = '13px';
  const etiqueta = el('label', null, fen.control.etiqueta);
  const palanca = document.createElement('input');
  palanca.type = 'range';
  palanca.className = 'palanca';
  palanca.min = fen.control.min; palanca.max = fen.control.max;
  palanca.value = fen.control.inicio;
  palanca.setAttribute('aria-label', fen.control.etiqueta);
  ctrl.appendChild(etiqueta); ctrl.appendChild(palanca);
  const leyenda = el('div','leyenda');
  leyenda.innerHTML = `<span>${fen.control.min}${fen.control.unidad}</span>
                       <span>${fen.control.max}${fen.control.unidad}</span>`;
  ctrl.appendChild(leyenda);

  let alterno = false;
  if (fen.alterno){
    const sw = el('button','losa opcion t-pasto');
    sw.style.fontSize = '15px'; sw.style.minHeight = '52px'; sw.style.marginTop = '12px';
    sw.style.width = '100%';
    sw.textContent = fen.alterno.off;
    sw.onclick = () => {
      alterno = !alterno;
      sw.textContent = alterno ? fen.alterno.on : fen.alterno.off;
      sw.classList.toggle('t-pasto', !alterno);
      sw.classList.toggle('t-piedra', alterno);
      Audio_.toque();
    };
    ctrl.appendChild(sw);
  }
  p.appendChild(ctrl);

  /* El texto y el sonido reaccionan al cruzar el umbral, no en cada pixel. */
  let anterior = null;
  function refrescar(){
    const v = Number(palanca.value);
    medida.textContent = `${fen.control.etiqueta}: ${v}${fen.control.unidad}`;
    const e = fen.estados.find(x => v <= x.hasta) || fen.estados[fen.estados.length-1];
    estado.textContent = e.txt;
    estado.classList.toggle('alerta', !!e.alerta);
    if (anterior !== e.txt){
      if (e.alerta && anterior !== null){ Audio_.nivel(); fogonazo(); Voz.decir(e.txt); }
      anterior = e.txt;
    }
  }
  palanca.oninput = refrescar;
  refrescar();

  const texto = el('div','explica');
  texto.style.marginTop = '13px';
  texto.innerHTML = fen.explica[edad === 'chico' ? 'chico' : 'grande'];
  p.appendChild(texto);

  const acciones = el('div','opciones');
  acciones.style.marginTop = '13px';
  const leer = el('button','losa opcion t-diamante');
  leer.style.fontSize = '15px'; leer.style.minHeight = '58px';
  leer.textContent = '🔊 Léemelo';
  leer.onclick = () => { Audio_.toque(); Voz.decir(texto.textContent, true); };
  const probar = el('button','losa opcion t-oro');
  probar.style.fontSize = '15px'; probar.style.minHeight = '58px';
  probar.innerHTML = est ? `Preguntarme ${'★'.repeat(est)}` : 'Ya entendí, pregúntame';
  probar.onclick = () => { Audio_.toque(); Simulacion.detener(); empezarNivel(bio, fen); };
  acciones.appendChild(leer); acciones.appendChild(probar);
  p.appendChild(acciones);
  p.appendChild(el('div','pie','Mueve la palanca y observa qué cambia.'));

  Simulacion.correr(lienzo, fen, () => ({ valor:Number(palanca.value), alterno }));
  if (edad === 'chico') setTimeout(()=> Voz.decir(fen.resumen, true), 500);
}

}

    else detalle = `Va bien en todos los niveles jugados`;
    c.innerHTML = `<span class="emblema">${bio.icono}</span>
      <span class="cuerpo"><b>${bio.nombre}</b>

        r.precision === null ? '—' : r.precision+'%'}</span>`;
    lista.appendChild(c);

  p.appendChild(lista);

  /* Los enunciados que fallaron, tal cual quedaron guardados. */
  const temas = [];
  BIOMAS.forEach(bio=>{
