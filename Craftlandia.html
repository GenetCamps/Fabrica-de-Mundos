/* ---------- Reto del día: repaso adaptativo ---------- */
function iniciarRepaso(){
  const perfil = Perfiles.actual();
  const edad = NINOS[perfil.id].perfilEdad;
  const fuentes = fuentesDebiles(perfil, edad);
  if (!fuentes.length) return;

  const nv = {
    id:'reto', nombre:'Reto del día', icono:'🎯',
    preguntas: edad === 'chico' ? 5 : 6,
    gen(){
      const f = elegirPonderado(fuentes);
      const q = f.nv.gen();
      q.__fuente = f;          /* de dónde salió, para devolverle el resultado */
      return q;
    }
  };
  const bio = {
    id:'repaso', nombre:'Reto del día', icono:'🎯',
    color:'t-rubi', tono:'#D14B3C', repaso:true,
    niveles: () => [nv]
  };
  perfil.retoFecha = new Date().toISOString().slice(0,10);
  Perfiles.persistir();
  empezarNivel(bio, nv);
}

/* Salir de un nivel: el reto del día no tiene mapa propio. */
function volverDelNivel(){
  const bio = Juego.bioma;
  if (!bio || bio.repaso) vistaMundo(); else vistaNiveles(bio.id);
}

/* ---------- Motor de juego ---------- */
function empezarNivel(bio, nv){
  Juego.bioma = bio; Juego.nivel = nv;
  Juego.indice = 0; Juego.aciertos = 0; Juego.errores = 0; Juego.preguntas = []; Juego.temas = [];
  /* La huella debe mirar el CONTENIDO, no solo el enunciado: hay muchos
     niveles donde el texto siempre es el mismo ("¿Qué letra falta?") y lo
     único que cambia son las opciones. Comparando solo el texto, la segunda
     pregunta parecía repetida y el nivel se acababa en el primer reto. */
  const huella = q => q.texto + '¦' + q.opciones[q.respuesta].valor +
                      '¦' + q.opciones.map(o => o.valor).sort().join('·') +
                      '¦' + (q.visual ? JSON.stringify(q.visual) : '');
  const vistos = new Set();
  let vueltas = 0;
  while (Juego.preguntas.length < nv.preguntas && vueltas < 400){
    vueltas++;
    const q = nv.gen();
    const h = huella(q);
    if (vistos.has(h)) continue;
    vistos.add(h);
    Juego.preguntas.push(q);
  }
  /* Si el banco da para menos, mejor repetir que dejar el nivel a medias. */
  while (Juego.preguntas.length < nv.preguntas) Juego.preguntas.push(nv.gen());
  Dificultad.reiniciar();
  pintarPregunta();
}

function pintarPregunta(){
  const p = pantalla();
  const nv = Juego.nivel;
  const q = Juego.preguntas[Juego.indice];
  Juego.bloqueado = false;

  const med = el('div','medidor');
  const j = el('div','jalones');
  for (let i=0;i<nv.preguntas;i++){
    const t = el('i');
    if (i < Juego.indice) t.className = Juego.preguntas[i].fallada ? 'raspon' : 'bien';
    j.appendChild(t);
  }
  med.appendChild(j);
  /* Adaptatividad real: si lleva dos fallos seguidos se le quita un
     distractor. La pregunta sigue siendo la misma, pero con menos ruido. */
  let opciones = q.opciones, respuesta = q.respuesta, conAyuda = false;
  if (Dificultad.necesitaRepaso() && opciones.length > 3){
    const correcta = opciones[respuesta];
    const otras = opciones.filter((_,i) => i !== respuesta);
    otras.splice(az(0, otras.length-1), 1);
    opciones = mezclar([correcta, ...otras]);
    respuesta = opciones.indexOf(correcta);
    conAyuda = true;
  }
  /* Índice de la respuesta tal como se está mostrando ahora mismo. */
  Juego.respuestaVisible = respuesta;

  p.appendChild(barra(`${nv.icono} ${nv.nombre}`,
    `Reto ${Juego.indice+1} de ${nv.preguntas}` + (conAyuda ? ' · te dejo menos opciones' : ''),
    volverDelNivel, med));

  const escena = el('div','escena');
  const caja = el('div','tablilla');
  caja.appendChild(el('div','enunciado', q.texto));
  if (q.visual) caja.appendChild(pintarVisual(q.visual));
  escena.appendChild(caja);

  const ops = el('div', 'opciones' + (opciones.length === 3 ? ' de3' : ''));
  opciones.forEach((o,i)=>{
    const btn = el('button','losa opcion');
    if (o.color) btn.style.background = o.color;
    else btn.classList.add(['t-pasto','t-oro','t-diamante','t-amatista'][i%4]);
    if (o.muestra) btn.appendChild(bloqueIso(38, o.muestra));
    if (o.bandera) btn.appendChild(pintarBandera(o.bandera, 88));
    if (o.emoji) btn.appendChild(el('span','emojo', o.emoji));
    if (o.etiqueta){
      if (o.chico || o.etiqueta.length > 4) btn.classList.add('texto-chico');
      btn.appendChild(el('div', null, o.etiqueta));
    }
    if (o.puntos > 0){
      const d = el('div','conteo');
      for (let k=0;k<o.puntos;k++) d.appendChild(el('i'));
      btn.appendChild(d);
    }
    btn.style.animationDelay = (140 + i*70)+'ms';
    btn.onclick = () => responder(i, btn, q, respuesta);
    ops.appendChild(btn);
  });
  escena.appendChild(ops);
  p.appendChild(escena);

  const pie = el('div','pie');
  const rb = el('button','losa icono-btn','🔊 Repetir');
  rb.onclick = () => { Audio_.toque(); Voz.decir(q.hablado, true); };
  pie.appendChild(rb);
  pie.appendChild(botonVoz());
  p.appendChild(pie);

  const chico = NINOS[Perfiles.actual().id].perfilEdad === 'chico';
  setTimeout(()=> Voz.decir(q.hablado, chico), 320);
}

function pintarBandera(b, ancho){
  const f = el('div','bandera');
  f.style.width = ancho+'px';
  f.style.setProperty('--fw', ancho+'px');
  f.style.background = b.capas.join(',');
  f.setAttribute('role','img');
  f.setAttribute('aria-label','Bandera de ' + b.n);
  (b.partes || []).forEach(p=>{
    const x = el('div', p.k);
    if (p.k === 'disco'){ x.style.background = p.color; x.style.height = p.tam+'%'; }
    else if (p.k === 'hoja'){ x.textContent = p.texto; }
    else x.style.background = p.color;
    f.appendChild(x);
  });
  return f;
}

function fichaLetra(txt, silaba, retraso){
  const f = el('div','ficha-letra' + (silaba ? ' silaba' : '') + (txt == null ? ' hueco' : ''));
  f.textContent = txt == null ? '?' : txt;
  f.style.animationDelay = retraso+'ms';
  return f;
}

function pintarVisual(v){
  const cont = el('div','montaje');

  if (v.tipo === 'emoji'){
    cont.appendChild(el('span','emojo', v.e));
    return cont;
  }
  if (v.tipo === 'bandera'){
    cont.appendChild(pintarBandera(v.b, 132));
    return cont;
  }
  if (v.tipo === 'bloque'){
    cont.appendChild(bloqueIso(62, v.c));
    return cont;
  }
  if (v.tipo === 'letras' || v.tipo === 'silabas'){
    const ped = el('div','pedestal');
    if (v.e) ped.appendChild(el('span','emojo', v.e));
    const tira = el('div','tira');
    v.partes.forEach((t,i)=> tira.appendChild(fichaLetra(t, v.tipo === 'silabas', 120+i*70)));
    ped.appendChild(tira);
    cont.appendChild(ped);
    return cont;
  }

  if (v.tipo === 'cubos'){
    const col = CUBOS[az(0,CUBOS.length-1)];
    for (let i=0;i<v.cantidad;i++) cont.appendChild(bloqueIso(34, col, i*70));
  }
  if (v.tipo === 'suma' || v.tipo === 'resta'){
    const g = el('div','conjunto');
    const g1 = el('div','montaje'); g1.style.marginTop = '0';
    for (let i=0;i<v.a;i++) g1.appendChild(bloqueIso(30, '#5BA83C', i*60));
    const signo = el('div','operador', v.tipo === 'suma' ? '+' : '−');
    const g2 = el('div','montaje'); g2.style.marginTop = '0';
    for (let i=0;i<v.b;i++){
      const c = bloqueIso(30, v.tipo === 'suma' ? '#F0B02E' : '#6B7285', 300+i*60);
      if (v.tipo === 'resta') c.classList.add('fantasma');
      g2.appendChild(c);
    }
    g.appendChild(g1); g.appendChild(signo); g.appendChild(g2);
    cont.appendChild(g);
  }
  return cont;
}

function responder(indice, boton, q, respuesta){
  if (Juego.bloqueado) return;
  Juego.bloqueado = true;
  const nombre = nombreHablado(Perfiles.actual().id);

  if (indice === (respuesta == null ? q.respuesta : respuesta)){
    Audio_.romper(); Audio_.acierto();
    fogonazo();
    boton.classList.add('ok');
    desmoronar(boton, getComputedStyle(boton).backgroundColor);
    chispas(boton);
    Juego.aciertos++;
    Dificultad.acierto();
    /* Con nombre a veces, no siempre: repetirlo en cada acierto cansa. */
    const conNombre = [`¡Muy bien, ${nombre}!`, `¡Eso es, ${nombre}!`,
                       `¡Vas muy bien, ${nombre}!`, `¡Bravo, ${nombre}!`];
    const sinNombre = ['¡Muy bien!', '¡Excelente!', '¡Correcto!', '¡Eso es!'];
    const banco = Math.random() < 0.45 ? conNombre : sinNombre;
    Voz.decir(banco[az(0, banco.length-1)]);
    setTimeout(siguiente, 950);
  } else {
    Audio_.fallo();
    boton.classList.add('mal');
    const g = el('div','grieta viva');
    g.innerHTML = `<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width:100%;height:100%">
      <path d="M50 4 L44 30 L58 42 L40 58 L52 74 L46 96 M44 30 L22 26 M58 42 L82 34 M40 58 L16 66 M52 74 L78 82"
        stroke="rgba(0,0,0,.55)" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg>`;
    boton.appendChild(g);
    Juego.errores++;
    Juego.preguntas[Juego.indice].fallada = true;
    if (!Juego.temas.includes(q.texto)) Juego.temas.push(q.texto);
    Dificultad.fallo();
    Voz.decir(Math.random() < 0.5 ? `Casi, ${nombre}. Prueba otra vez.` : 'Casi. Prueba otra vez.');
    setTimeout(()=>{
      boton.classList.add('t-off');
      Juego.bloqueado = false;
    }, 640);
  }
}

function siguiente(){
  Dificultad.cerrarPregunta(!!Juego.preguntas[Juego.indice].fallada);
  Juego.indice++;
  if (Juego.indice >= Juego.preguntas.length) terminarNivel();
  else pintarPregunta();
}

async function terminarNivel(){
  const perfil = Perfiles.actual();
  const nv = Juego.nivel, bio = Juego.bioma;
  const niveles = bio.niveles(NINOS[perfil.id].perfilEdad);
  const prog = perfil.biomas[bio.id];

  const est = Juego.errores === 0 ? 3 : (Juego.errores <= 2 ? 2 : 1);
  const previas = prog.estrellas[nv.id] || 0;
  if (est > previas){ perfil.estrellasTotales += (est - previas); prog.estrellas[nv.id] = est; }
  const xpGanado = Juego.aciertos*10 + est*15;
  perfil.xp += xpGanado;
  const st = Desempeno.registrar(prog, nv.id, Juego.aciertos, Juego.errores, Juego.temas);
  /* En el reto del día, cada pregunta le suma al nivel de donde salió:
     practicar aquí también mejora (o empeora) el nivel original. */
  if (bio.repaso){
    const porFuente = new Map();
    Juego.preguntas.forEach(q=>{
      if (!q.__fuente) return;
      const k = q.__fuente.bio.id + '|' + q.__fuente.nv.id;
      const e = porFuente.get(k) || { f:q.__fuente, a:0, e:0, t:[] };
      if (q.fallada){ e.e++; e.t.push(q.texto); } else e.a++;
      porFuente.set(k, e);
    });
    porFuente.forEach(v=>{
      Desempeno.registrar(perfil.biomas[v.f.bio.id], v.f.nv.id, v.a, v.e, v.t);
    });
  }
  const precision = Desempeno.precision(prog, nv.id);
  const flojo = Desempeno.necesitaPractica(prog, nv.id);
  const dominado = Dificultad.sugiereAvanzar() && Juego.errores === 0;
  const desbloqueo = nv.id < niveles.length && prog.nivelMax === nv.id;
  if (desbloqueo) prog.nivelMax = nv.id + 1;
  await Perfiles.persistir();

  Audio_.nivel();
  const p = pantalla();
  p.appendChild(barra(bio.repaso ? 'Reto terminado' : 'Nivel completado',
                      nv.nombre, volverDelNivel, medidorPerfil()));

  const r = el('div','desenlace');
  const plat = el('div','plataforma');
  plat.style.height = '132px'; plat.style.position = 'relative';
  plat.style.display = 'flex'; plat.style.alignItems = 'flex-end'; plat.style.justifyContent = 'center';
  plat.appendChild(el('div','sombra'));
  plat.appendChild(dibujarAvatar(NINOS[perfil.id], 6, true, perfil.equipado));
  r.appendChild(plat);

  r.appendChild(el('h2', null,
    est === 3 ? `¡Perfecto, ${NINOS[perfil.id].nombre}!` :
    est === 2 ? `¡Muy bien, ${NINOS[perfil.id].nombre}!` :
                `¡Lo lograste, ${NINOS[perfil.id].nombre}!`));

  const tr = el('div','trofeos');
  tr.innerHTML = [0,1,2].map(i => estrellaSVG(i < est)).join('');
  [...tr.children].forEach((s,i)=>{ s.style.animationDelay = (260 + i*220)+'ms'; });
  r.appendChild(tr);
  for (let i=0;i<est;i++) setTimeout(()=>Audio_.estrella(i), 300 + i*220);

  const nivelExp = 1 + Math.floor(perfil.xp/150);
  const riel = el('div','xp-riel'); riel.innerHTML = '<i></i>';
  r.appendChild(riel);
  setTimeout(()=>{ riel.firstChild.style.width = ((perfil.xp % 150)/150*100)+'%'; }, 700);

  r.appendChild(el('div','sumario',
    `Aciertos: ${Juego.aciertos} de ${Juego.preguntas.length}  ·  precisión ${precision}%\n` +
    `+${xpGanado} XP  ·  Explorador nivel ${nivelExp}` +
    (desbloqueo ? `\n🔓 Se abrió el nivel ${nv.id+1}` : '') +
    (flojo ? `\n💡 Te recomiendo repetir este nivel antes de seguir`
           : dominado ? `\n🚀 Ya lo dominas, puedes avanzar` : '')));

  const acciones = el('div','opciones');
  acciones.style.marginTop = '6px'; acciones.style.width = 'min(400px,88vw)';
  /* El botón dorado es el que se recomienda: repetir si batalló,
     avanzar si ya lo domina. */
  const otra = el('button','losa opcion ' + (flojo ? 't-oro' : 't-pasto'));
  otra.style.fontSize = '16px'; otra.style.minHeight = '62px';
  otra.textContent = bio.repaso ? 'Otro reto' : flojo ? 'Practicar otra vez' : 'Jugar otra vez';
  otra.onclick = () => { Audio_.toque(); if (bio.repaso) iniciarRepaso(); else empezarNivel(bio, nv); };
  const seguir = el('button','losa opcion ' + (flojo ? 't-off' : 't-oro'));
  seguir.style.fontSize = '16px'; seguir.style.minHeight = '62px';
  const proximo = bio.repaso ? null : niveles.find(x => x.id === nv.id+1);
  if (proximo && proximo.id <= prog.nivelMax){
    seguir.textContent = bio.especial ? `${proximo.icono} ${proximo.nombre} ▶` : `Nivel ${proximo.id} ▶`;
    seguir.onclick = () => {
      Audio_.toque();
      if (bio.especial) vistaExperimento(bio, proximo); else empezarNivel(bio, proximo);
    };
  } else {
    seguir.textContent = bio.repaso ? 'Volver al mundo' : 'Ver el mapa';
    seguir.onclick = () => { Audio_.toque(); volverDelNivel(); };
  }
  acciones.appendChild(otra); acciones.appendChild(seguir);
  [...acciones.children].forEach((c,i)=>{ c.style.animationDelay = (900 + i*120)+'ms'; });
  r.appendChild(acciones);
  p.appendChild(r);

  const nom = nombreHablado(perfil.id);
  if (!REDUCIR){
    setTimeout(()=>chispas(tr), 400);
    /* Sacar las tres estrellas merece una celebración de verdad. */
    if (est === 3){
      [700, 950, 1200].forEach(t => setTimeout(()=>{ chispas(tr); fogonazo(); }, t));
    }
  }

  const cierre = est === 3
    ? [`¡Perfecto, ${nom}! Ganaste las tres estrellas. ¡Eres un maestro!`,
       `¡Increíble, ${nom}! Tres estrellas. Lo hiciste sin equivocarte.`,
       `¡Bravo, ${nom}! Tres estrellas para ti. ¡Qué orgullo!`][az(0,2)]
    : est === 2
    ? `¡Muy bien, ${nom}! Ganaste dos estrellas.`
    : `¡Lo lograste, ${nom}! Ganaste una estrella.`;
  const extra = desbloqueo ? ` Y abriste el nivel ${nv.id+1}, ${nom}.` : '';
  Voz.decir(cierre + extra);
}

/* ============================ app/Instalable ============================ */
/* El manifiesto y los íconos se generan aquí mismo, así el juego sigue
   siendo un solo archivo. Para funcionar sin internet hace falta además
   subir sw.js junto al HTML; si no está, todo lo demás funciona igual. */
const Instalable = (() => {
  let evento = null, listo = false;

  function dibujarIcono(tam){
    const c = document.createElement('canvas');
    c.width = c.height = tam;
    const g = c.getContext('2d');
    /* fondo */
    const f = g.createLinearGradient(0,0,0,tam);
    f.addColorStop(0,'#1B2B4C'); f.addColorStop(1,'#3E5C86');
    g.fillStyle = f; g.fillRect(0,0,tam,tam);
    /* bloque isométrico de pasto, la misma imagen del juego */
    const cx = tam/2, cy = tam*0.54;
    const an = tam*0.27, al = tam*0.16, lado = tam*0.24;
    const cara = (pts, color) => {
      g.fillStyle = color; g.beginPath();
      pts.forEach(([x,y],i)=> i ? g.lineTo(x,y) : g.moveTo(x,y));
      g.closePath(); g.fill();
    };
    const topY = cy - lado/2;
    cara([[cx,topY-al],[cx+an,topY],[cx,topY+al],[cx-an,topY]], '#74C24C');
    cara([[cx-an,topY],[cx,topY+al],[cx,topY+al+lado],[cx-an,topY+lado]], '#6B4526');
    cara([[cx+an,topY],[cx,topY+al],[cx,topY+al+lado],[cx+an,topY+lado]], '#8B5A2B');
    /* borde de pasto en las caras laterales */
    cara([[cx-an,topY],[cx,topY+al],[cx,topY+al*0.45+tam*0.05],[cx-an,topY+tam*0.05]], '#4E8F33');
    cara([[cx+an,topY],[cx,topY+al],[cx,topY+al*0.45+tam*0.05],[cx+an,topY+tam*0.05]], '#5BA83C');
    return c.toDataURL('image/png');
  }

  function preparar(){
    if (listo) return;
    let i192, i512;
    try{ i192 = dibujarIcono(192); i512 = dibujarIcono(512); }
    catch(e){ return; }   /* si el canvas falla, el juego sigue igual */

    const manifiesto = {
      name:'Craftlandia', short_name:'Craftlandia',
      description:'Aprende matemáticas, letras, geografía, inglés y francés jugando',
      start_url:'.', scope:'.', display:'standalone', orientation:'any',
      background_color:'#101B33', theme_color:'#141E33', lang:'es-MX',
      icons:[
        {src:i192, sizes:'192x192', type:'image/png', purpose:'any'},
        {src:i512, sizes:'512x512', type:'image/png', purpose:'any'},
        {src:i512, sizes:'512x512', type:'image/png', purpose:'maskable'}
      ]
    };
    try{
      const blob = new Blob([JSON.stringify(manifiesto)], {type:'application/manifest+json'});
      const enlace = document.createElement('link');
      enlace.rel = 'manifest';
      enlace.href = URL.createObjectURL(blob);
      document.head.appendChild(enlace);
    }catch(e){}
    /* iOS no lee el manifiesto: usa su propia etiqueta */
    try{
      const apple = document.createElement('link');
      apple.rel = 'apple-touch-icon';
      apple.href = dibujarIcono(180);
      document.head.appendChild(apple);
    }catch(e){}
    listo = true;
  }

  function registrarSW(){
    if (!('serviceWorker' in navigator)) return;
    if (!/^https?:$/.test(location.protocol)) return;   /* en file:// no aplica */
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }

  return {
    iniciar(){
      preparar();
      registrarSW();
      window.addEventListener('beforeinstallprompt', e=>{
        e.preventDefault(); evento = e;
      });
    },
    yaInstalada(){
      return window.matchMedia('(display-mode: standalone)').matches ||
             window.navigator.standalone === true;
    },
    esIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent || ''); },
    puede(){ return !!evento; },
    async instalar(){
      if (!evento) return false;
      evento.prompt();
      try{ await evento.userChoice; }catch(e){}
      evento = null;
      return true;
    }
  };
})();

/* Botón o instrucción para dejarlo como app en la pantalla de inicio. */
function bloqueInstalar(){
  if (Instalable.yaInstalada()) return null;
  if (Instalable.puede()){
    const b = el('button','losa bioma t-diamante');
    b.innerHTML = `<span class="emblema">📲</span>
      <span class="cuerpo"><b>Instalar Craftlandia</b>
      <em>Queda como app, con su ícono y sin barra del navegador</em></span>`;
    b.onclick = async () => { Audio_.toque(); await Instalable.instalar(); vistaMundo(); };
    return b;
  }
  if (Instalable.esIOS()){
    const c = el('div','losa bioma t-off');
    c.style.cursor = 'default';
    c.innerHTML = `<span class="emblema">📲</span>
      <span class="cuerpo"><b>Ponlo en la pantalla de inicio</b>
      <em>Toca Compartir ⬆️ y luego "Agregar a inicio". Queda como app.</em></span>`;
    return c;
  }
  return null;
}

/* ============================ Arranque ============================ */
(async function(){
  Escenografia.montar();
  Instalable.iniciar();
  await Perfiles.iniciar();
  Voz.conectar(Perfiles.ajustes(), Perfiles.persistir);
  vistaPortada();
  document.addEventListener('pointerdown', () => { Audio_.despertar(); Voz.desbloquear(); }, { once:true });
})();
</script>
